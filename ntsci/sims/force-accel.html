<title>Speeding up</title>
<div id="nt"></div>
<script>
(() => {
const A = { small: 2, mid: 4, big: 6 };          // acceleration in m/s² for each push
NT.sim({
  title: 'Speeding up', emoji: '🏎️',
  idea: 'Acceleration = change in speed ÷ time taken. It tells us how quickly the speed changes.',
  controls: [{ id: 'push', label: 'Push from the engine', noun: 'the size of the push', value: 'mid', options: [['small', 'Small push'], ['mid', 'Medium push'], ['big', 'Big push']] }],
  go: { label: 'Go for 5 seconds', time: 5 },
  readings: [
    { id: 'v0', label: 'Speed at the start', unit: 'm/s', always: true, get: () => 0 },
    { id: 'v5', label: 'Speed after 5 s', noun: 'the speed after 5 s', unit: 'm/s', get: s => 5 * A[s.push] },
    { id: 'acc', label: 'Acceleration', noun: 'the acceleration', unit: 'm/s²', get: s => A[s.push] },
  ],
  say: (s, done) => done ? 'Acceleration = change in speed ÷ time = ' + 5 * A[s.push] + ' m/s ÷ 5 s = ' + A[s.push] + ' m/s². The speed goes up by ' + A[s.push] + ' m/s every second.' : '',
  draw(P, s, p) {
    const C = P.C, a = A[s.push], tt = p * 5, v = a * tt, moved = 0.5 * a * tt * tt;
    // road that scrolls as the car moves
    P.rect(0, 300, 900, 110, { fill: '#5d6d7c' }); for (let i = -1; i < 12; i++) P.rect(i * 90 - ((moved * 12) % 90), 350, 50, 8, { fill: '#fff' });
    P.emoji('🏎️', 230, 318, 110, { flip: true }); if (p > 0 && p < 1) for (let i = 0; i < 3; i++) P.line(120 - i * 22 - v, 300 + i * 16, 150 - i * 22, 300 + i * 16, { color: '#fff', lw: 4 });
    // speedometer
    const cx = 730, cy = 200, R = 110; P.circle(cx, cy, R, { fill: '#fff', stroke: C.dark, lw: 6 });
    for (let k = 0; k <= 30; k += 5) { const an = Math.PI * (0.85 + (1.3 * k) / 30); P.line(cx + (R - 16) * Math.cos(an), cy + (R - 16) * Math.sin(an), cx + (R - 4) * Math.cos(an), cy + (R - 4) * Math.sin(an), { color: C.dark, lw: 3 }); if (k % 10 === 0) P.text(String(k), cx + (R - 34) * Math.cos(an), cy + (R - 34) * Math.sin(an), { size: 17 }); }
    const an = Math.PI * (0.85 + (1.3 * v) / 30); P.line(cx, cy, cx + (R - 26) * Math.cos(an), cy + (R - 26) * Math.sin(an), { color: C.red, lw: 7 }); P.circle(cx, cy, 9, { fill: C.dark });
    P.text(v.toFixed(0) + ' m/s', cx, cy + 56, { size: 28 }); P.text('speedometer', cx, cy + R + 22, { size: 16, color: C.mute });
    // the speed at each second
    P.text('Speed at each second', 300, 60, { size: 19 });
    for (let k = 0; k <= 5; k++) { const on = tt >= k - 0.001, x = 70 + k * 80; P.rect(x, 86, 70, 76, { fill: on ? '#fff8d6' : C.soft, stroke: on ? C.yellow : C.line, lw: 3, r: 10 }); P.text(k + ' s', x + 35, 106, { size: 16, color: C.mute }); P.text(on ? a * k + '' : '?', x + 35, 138, { size: 26, color: on ? C.ink : C.grey }); }
    P.text('m/s', 572, 138, { size: 17, color: C.mute });
  },
  inquiry: [{
    q: 'Does a bigger push make the car speed up more quickly?',
    guess: ['Bigger push → the speed goes up faster', 'Bigger push → the speed goes up more slowly', 'The push makes no difference'], guessAns: 0,
    change: 'push', measure: ['v5', 'acc'],
    same: ['the same car', 'the same time (5 s)', 'starting from rest (0 m/s)'],
    found: ['A bigger push makes the speed increase ', ['more quickly', 'more slowly'], '. Acceleration = change in speed ÷ ', ['time taken', 'distance'], '.'], foundAns: [0, 0],
    why: 'A force can change the speed of an object. An acceleration of 4 m/s² means the speed goes up by 4 m/s every second.',
  }],
});
})();
</script>
