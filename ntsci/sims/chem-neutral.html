<title>Neutralisation</title>
<div id="nt"></div>
<script>
(() => {
const PHC = ['#d7191c', '#dd2f1c', '#e4501e', '#ec7422', '#f39a1f', '#f4c20d', '#c4d02f', '#3aa655', '#2e9e8a', '#2a7de1'];
const PH = { 0: 2, 1: 3, 2: 5, 3: 7 };
NT.sim({
  title: 'Cancel out the acid', emoji: '💊',
  idea: 'Acid + base → salt + water. This reaction is called neutralisation.',
  controls: [{ id: 'n', label: 'Antacid tablets added (a base)', noun: 'the number of antacid tablets', value: 0, options: [[0, 'None'], [1, '1 tablet', '💊'], [2, '2 tablets', '💊'], [3, '3 tablets', '💊']] }],
  go: { label: 'Stir', time: 3.5 },
  readings: [{ id: 'ph', label: 'pH after stirring', noun: 'the pH', get: s => PH[s.n] }],
  say: (s, done) => !done ? '' : s.n === 3 ? 'pH 7: neutral! The base has neutralised the acid. Salt and water are made.' : s.n === 0 ? 'No base added. It is still a strong acid.' : 'Less acidic now, but not neutral yet.',
  draw(P, s, p, t) {
    const C = P.C, v = 2 + (PH[s.n] - 2) * p, col = PHC[Math.round(v)];
    P.rect(0, 410, 900, 70, { fill: '#e9edf1' });
    P.beaker(250, 160, 260, 250, { level: 0.72, color: col, alpha: 0.85 }); P.text('acid + universal indicator', 380, 440, { size: 17, color: C.mute });
    // tablets sinking and dissolving
    for (let i = 0; i < s.n; i++) { const y = p === 0 ? 120 : 240 + 150 * Math.min(1, p * 2.2), sz = 34 * (p === 0 ? 1 : Math.max(0, 1 - p)); if (sz > 2) P.emoji('💊', 320 + i * 60, y, sz); }
    // stirring rod
    const sw = p > 0 && p < 1 ? 50 * Math.sin(t * 9) : 0; P.line(380 + sw * 0.3, 90, 380 + sw, 380, { color: '#9fb4c7', lw: 9 });
    P.meter(680, 160, 'pH ' + v.toFixed(0), { label: 'pH meter', w: 150 });
    const x0 = 560, w = 24; for (let i = 0; i <= 9; i++) { P.rect(x0 + i * w, 260, w, 50, { fill: PHC[i] }); P.text(String(i), x0 + i * w + w / 2, 326, { size: 14, color: C.mute }); }
    P.rect(x0, 260, 10 * w, 50, { stroke: C.dark, lw: 3 }); P.poly([[x0 + v * w + w / 2, 256], [x0 + v * w - 6, 236], [x0 + v * w + w + 6, 236]], { fill: C.ink });
    P.text('7 = neutral', x0 + 7.5 * w, 356, { size: 16, color: PHC[7] });
  },
  inquiry: [{
    q: 'What happens to the pH of an acid when you add a base (antacid)?',
    guess: ['The pH goes up towards 7', 'The pH goes down', 'The pH stays at 2'], guessAns: 0,
    change: 'n', measure: 'ph',
    same: ['the same amount of acid', 'the same kind of tablet', 'stir each time'],
    found: ['Adding a base to an acid moves the pH ', ['towards 7', 'away from 7'], '. This reaction is called ', ['neutralisation', 'evaporation'], '. The products are ', ['salt and water', 'acid and gas'], '.'], foundAns: [0, 0, 0],
    why: 'Toothpaste and antacid are bases. Toothpaste neutralises the acid made by bacteria in the mouth. Antacid neutralises extra acid in the stomach.',
  }],
});
})();
</script>
