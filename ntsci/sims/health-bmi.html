<title>BMI</title>
<div id="nt"></div>
<script>
(() => {
const bmi = s => s.m / (s.h * s.h);
// BMI-for-age charts for ages 12 to 18 (G1 Science Activity Book, 8.2A, Tables 1 and 2).
// For each age: the highest BMI for severely underweight, underweight, acceptable weight and overweight. Above the last = severely overweight.
const CHART = {
  male: { 12: [14.4, 14.8, 24.3, 29.2], 13: [14.7, 15.1, 25.0, 30.0], 14: [15.0, 15.4, 25.5, 30.6], 15: [15.3, 15.8, 26.1, 31.2], 16: [15.6, 16.1, 26.5, 31.7], 17: [15.9, 16.3, 27.0, 32.1], 18: [16.1, 16.6, 27.4, 32.4] },
  female: { 12: [14.4, 14.8, 23.4, 27.5], 13: [14.8, 15.2, 24.0, 28.3], 14: [15.1, 15.5, 24.6, 28.9], 15: [15.4, 15.8, 25.0, 29.4], 16: [15.7, 16.1, 25.4, 29.7], 17: [15.9, 16.3, 25.7, 30.0], 18: [16.1, 16.5, 25.9, 30.3] },
};
const NAMES = ['severely underweight', 'underweight', 'acceptable weight', 'overweight', 'severely overweight'];
const COLS = ['#2a5fd0', '#5aa0e8', '#2e9e5b', '#f08a24', '#d7263d'];
const r1 = v => Math.round(v * 10) / 10;
const band = s => { const b = r1(bmi(s)), t = CHART[s.sex][s.age]; let k = 0; while (k < 4 && b > t[k]) k++; return k; };
const AGES = [12, 13, 14, 15, 16, 17, 18];
NT.sim({
  title: 'Body mass index (BMI)', emoji: '⚖️',
  idea: 'BMI = mass (kg) ÷ [height (m) × height (m)]. Compare the BMI with the BMI-for-age chart to find the weight indicator.',
  controls: [
    { id: 'sex', label: 'Chart for', value: 'male', options: [['male', 'Male', '👦'], ['female', 'Female', '👧']] },
    { id: 'age', label: 'Age', value: 15, options: AGES.map(a => [a, String(a)]) },
    { id: 'm', label: 'Mass', noun: 'the mass', type: 'range', min: 30, max: 100, step: 1, value: 50, unit: 'kg' },
    { id: 'h', label: 'Height', noun: 'the height', type: 'range', min: 1.3, max: 1.9, step: 0.01, value: 1.6, unit: 'm', fmt: v => v.toFixed(2) },
  ],
  readings: [
    { id: 'bmi', label: 'BMI', noun: 'the BMI', always: true, dp: 1, get: bmi },
    { id: 'z', label: 'Weight indicator', noun: 'the weight indicator', always: true, get: s => NAMES[band(s)] },
  ],
  say: s => 'BMI = ' + s.m + ' ÷ (' + s.h.toFixed(2) + ' × ' + s.h.toFixed(2) + ') = ' + s.m + ' ÷ ' + (s.h * s.h).toFixed(2) + ' = ' + bmi(s).toFixed(1),
  draw(P, s) {
    const C = P.C, b = bmi(s), k = band(s), t = CHART[s.sex][s.age], H = s.h * 190, w = Math.max(26, Math.min(110, (b - 8) * 4)), base = 420, top = base - H, cx = 200;
    P.rect(0, 420, 900, 60, { fill: '#e9edf1' });
    // height scale and weighing scale
    P.rect(60, base - 1.9 * 190 - 6, 22, 1.9 * 190 + 6, { fill: '#fff8d6', stroke: C.dark, lw: 3 }); [1.3, 1.5, 1.7, 1.9].forEach(v => { P.line(60, base - v * 190, 96, base - v * 190, { color: C.dark, lw: 2 }); P.text(v.toFixed(1) + ' m', 30, base - v * 190, { size: 14, color: C.mute }); });
    P.line(82, top, cx + 70, top, { color: C.red, lw: 2, dash: [6, 6] });
    P.rect(cx - 70, base, 140, 22, { fill: C.dark, r: 6 }); P.text(s.m + ' kg', cx, base + 40, { size: 20 });
    // the person
    const head = H * 0.13; P.circle(cx, top + head, head, { fill: '#f6c9a0', stroke: C.dark, lw: 3 });
    P.oval(cx, top + head * 2 + H * 0.24, w * 0.5, H * 0.24, { fill: COLS[k], stroke: C.dark, lw: 3 });
    P.line(cx - w * 0.22, top + head * 2 + H * 0.44, cx - w * 0.22, base, { color: C.dark, lw: Math.max(8, w * 0.2) }); P.line(cx + w * 0.22, top + head * 2 + H * 0.44, cx + w * 0.22, base, { color: C.dark, lw: Math.max(8, w * 0.2) });
    P.line(cx - w * 0.5, top + head * 2 + H * 0.1, cx - w * 0.5 - 16, top + head * 2 + H * 0.36, { color: '#f6c9a0', lw: 10 }); P.line(cx + w * 0.5, top + head * 2 + H * 0.1, cx + w * 0.5 + 16, top + head * 2 + H * 0.36, { color: '#f6c9a0', lw: 10 });
    // the chart row for this sex and age, drawn as a coloured scale from 12 to 36
    const x0 = 380, wd = 480, lo = 12, hi = 36, X = v => x0 + ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * wd;
    const edges = [lo, t[0] + 0.05, t[1] + 0.05, t[2] + 0.05, t[3] + 0.05, hi];
    for (let i = 0; i < 5; i++) P.rect(X(edges[i]), 200, X(edges[i + 1]) - X(edges[i]), 54, { fill: COLS[i], alpha: i === k ? 1 : 0.55 });
    P.rect(x0, 200, wd, 54, { stroke: C.dark, lw: 3 });
    P.text('acceptable weight', (X(edges[2]) + X(edges[3])) / 2, 227, { size: 15, color: '#fff' });
    [t[1], t[2]].forEach(v => P.text(v.toFixed(1), X(v + 0.05), 274, { size: 14, color: C.mute }));
    P.text(String(lo), X(lo), 274, { size: 14, color: C.mute }); P.text(String(hi), X(hi), 274, { size: 14, color: C.mute });
    P.poly([[X(b), 196], [X(b) - 12, 170], [X(b) + 12, 170]], { fill: C.ink }); P.text('BMI ' + b.toFixed(1), X(b), 150, { size: 26 });
    P.tag(NAMES[k], x0 + wd / 2, 90, { bg: COLS[k], size: 20 });
    // the chart row in words
    P.text('BMI-for-age chart: ' + s.sex + ', age ' + s.age, x0 + wd / 2, 312, { size: 16 });
    const f = v => v.toFixed(1), lines = ['severely underweight: ' + f(t[0]) + ' or less', 'underweight: ' + f(t[0] + 0.1) + ' to ' + f(t[1]), 'acceptable weight: ' + f(t[1] + 0.1) + ' to ' + f(t[2]), 'overweight: ' + f(t[2] + 0.1) + ' to ' + f(t[3]), 'severely overweight: ' + f(t[3] + 0.1) + ' or more'];
    lines.forEach((ln, i) => P.text(ln, i < 3 ? x0 + 10 : x0 + wd / 2 + 30, 340 + (i % 3) * 22, { size: 14, align: 'left', color: i === k ? COLS[i] : C.mute, bold: i === k }));
  },
  inquiry: [
    { name: 'Change the mass', q: 'A 15-year-old boy is 1.60 m tall. What happens to his BMI and weight indicator as his mass goes up?',
      guess: ['The BMI goes up', 'The BMI goes down', 'The BMI stays the same'], guessAns: 0,
      change: 'm', measure: ['bmi', 'z'], dv: 'the BMI and the weight indicator', fix: { sex: 'male', age: 15, h: 1.6 }, tests: [40, 50, 60, 70, 80],
      same: ['the height (1.60 m)', 'the same BMI-for-age chart (male, 15)'],
      found: ['At the same height, a bigger mass gives a ', ['bigger', 'smaller'], ' BMI. For this boy, a mass of ', ['50 kg', '80 kg'], ' is an acceptable weight.'], foundAns: [0, 0],
      why: 'BMI = mass (kg) ÷ [height (m) × height (m)]. The BMI-for-age chart tells us whether the mass is in the healthy range for a person of that age and sex.' },
    { name: 'Change the height', q: 'A 15-year-old boy has a mass of 60 kg. What happens to his BMI if he is taller?',
      guess: ['The BMI goes down', 'The BMI goes up', 'The BMI stays the same'], guessAns: 0,
      change: 'h', measure: ['bmi', 'z'], dv: 'the BMI and the weight indicator', fix: { sex: 'male', age: 15, m: 60 }, tests: [1.5, 1.6, 1.7, 1.8],
      same: ['the mass (60 kg)', 'the same BMI-for-age chart (male, 15)'],
      found: ['For the same mass, a taller person has a ', ['smaller', 'bigger'], ' BMI. So we must compare mass ', ['with height', 'on its own'], '.'], foundAns: [0, 0],
      why: 'The same mass can be an acceptable weight for a tall person but overweight for a short person. That is why BMI uses both mass and height.' },
  ],
});
})();
</script>
