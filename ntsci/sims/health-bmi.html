<title>BMI</title>
<div id="nt"></div>
<script>
(() => {
const bmi = s => s.m / (s.h * s.h);
const LO = 18.5, HI = 23;                       // healthy range used here: 18.5 to 22.9 (adult guide used in Singapore)
const zone = b => (b < LO ? ['below the healthy range', '#2a7de1'] : b < HI ? ['in the healthy range', '#2e9e5b'] : ['above the healthy range', '#e4572e']);
NT.sim({
  title: 'Body mass index (BMI)', emoji: '⚖️',
  idea: 'BMI = mass (kg) ÷ [height (m) × height (m)]. It shows if a person\'s mass is in the healthy range.',
  controls: [
    { id: 'm', label: 'Mass', noun: 'the mass', type: 'range', min: 30, max: 100, step: 1, value: 50, unit: 'kg' },
    { id: 'h', label: 'Height', noun: 'the height', type: 'range', min: 1.3, max: 1.9, step: 0.01, value: 1.6, unit: 'm', fmt: v => v.toFixed(2) },
  ],
  readings: [
    { id: 'bmi', label: 'BMI', noun: 'the BMI', always: true, dp: 1, get: bmi },
    { id: 'z', label: 'This mass is', always: true, get: s => zone(bmi(s))[0] },
  ],
  say: s => 'BMI = ' + s.m + ' ÷ (' + s.h.toFixed(2) + ' × ' + s.h.toFixed(2) + ') = ' + s.m + ' ÷ ' + (s.h * s.h).toFixed(2) + ' = ' + bmi(s).toFixed(1),
  draw(P, s) {
    const C = P.C, b = bmi(s), z = zone(b), H = s.h * 190, w = Math.max(26, Math.min(110, (b - 8) * 4)), base = 420, top = base - H, cx = 200;
    P.rect(0, 420, 900, 60, { fill: '#e9edf1' });
    // height scale and weighing scale
    P.rect(60, base - 1.9 * 190 - 6, 22, 1.9 * 190 + 6, { fill: '#fff8d6', stroke: C.dark, lw: 3 }); [1.3, 1.5, 1.7, 1.9].forEach(v => { P.line(60, base - v * 190, 96, base - v * 190, { color: C.dark, lw: 2 }); P.text(v.toFixed(1) + ' m', 30, base - v * 190, { size: 14, color: C.mute }); });
    P.line(82, top, cx + 70, top, { color: C.red, lw: 2, dash: [6, 6] });
    P.rect(cx - 70, base, 140, 22, { fill: C.dark, r: 6 }); P.text(s.m + ' kg', cx, base + 40, { size: 20 });
    // the person
    const head = H * 0.13; P.circle(cx, top + head, head, { fill: '#f6c9a0', stroke: C.dark, lw: 3 });
    P.oval(cx, top + head * 2 + H * 0.24, w * 0.5, H * 0.24, { fill: z[1], stroke: C.dark, lw: 3 });
    P.line(cx - w * 0.22, top + head * 2 + H * 0.44, cx - w * 0.22, base, { color: C.dark, lw: Math.max(8, w * 0.2) }); P.line(cx + w * 0.22, top + head * 2 + H * 0.44, cx + w * 0.22, base, { color: C.dark, lw: Math.max(8, w * 0.2) });
    P.line(cx - w * 0.5, top + head * 2 + H * 0.1, cx - w * 0.5 - 16, top + head * 2 + H * 0.36, { color: '#f6c9a0', lw: 10 }); P.line(cx + w * 0.5, top + head * 2 + H * 0.1, cx + w * 0.5 + 16, top + head * 2 + H * 0.36, { color: '#f6c9a0', lw: 10 });
    // BMI scale 12 to 36
    const x0 = 400, wd = 440, X = v => x0 + ((Math.max(12, Math.min(36, v)) - 12) / 24) * wd;
    P.rect(X(12), 200, X(LO) - X(12), 54, { fill: '#2a7de1' }); P.rect(X(LO), 200, X(HI) - X(LO), 54, { fill: '#2e9e5b' }); P.rect(X(HI), 200, X(36) - X(HI), 54, { fill: '#e4572e' }); P.rect(x0, 200, wd, 54, { stroke: C.dark, lw: 3 });
    [12, 18.5, 23, 30, 36].forEach(v => P.text(String(v), X(v), 274, { size: 15, color: C.mute }));
    P.text('below', (X(12) + X(LO)) / 2, 227, { size: 16, color: '#fff' }); P.text('healthy', (X(LO) + X(HI)) / 2, 227, { size: 15, color: '#fff' }); P.text('above', (X(HI) + X(36)) / 2, 227, { size: 16, color: '#fff' });
    P.poly([[X(b), 196], [X(b) - 12, 170], [X(b) + 12, 170]], { fill: C.ink }); P.text('BMI ' + b.toFixed(1), X(b), 150, { size: 26 });
    P.tag(z[0], x0 + wd / 2, 90, { bg: z[1], size: 20 }); P.text('Healthy range used here: 18.5 to 22.9', x0 + wd / 2, 320, { size: 16, color: C.mute }); P.text('(your teacher may give you a different table)', x0 + wd / 2, 344, { size: 15, color: C.mute, bold: false });
  },
  inquiry: [
    { name: 'Change the mass', q: 'Same height (1.60 m). What happens to the BMI when the mass goes up?',
      guess: ['The BMI goes up', 'The BMI goes down', 'The BMI stays the same'], guessAns: 0,
      change: 'm', measure: ['bmi', 'z'], dv: 'the BMI', fix: { h: 1.6 }, tests: [40, 50, 60, 70],
      same: ['the height (1.60 m)', 'the same healthy range table'],
      found: ['At the same height, a bigger mass gives a ', ['bigger', 'smaller'], ' BMI. For 1.60 m, a mass of ', ['50 kg', '70 kg'], ' is in the healthy range.'], foundAns: [0, 0],
      why: 'BMI = mass (kg) ÷ [height (m) × height (m)]. BMI helps us check whether the mass of a person is in the healthy range for their height.' },
    { name: 'Change the height', q: 'Same mass (60 kg). What happens to the BMI when the person is taller?',
      guess: ['The BMI goes down', 'The BMI goes up', 'The BMI stays the same'], guessAns: 0,
      change: 'h', measure: ['bmi', 'z'], dv: 'the BMI', fix: { m: 60 }, tests: [1.5, 1.6, 1.7, 1.8],
      same: ['the mass (60 kg)', 'the same healthy range table'],
      found: ['For the same mass, a taller person has a ', ['smaller', 'bigger'], ' BMI. So we must compare mass ', ['with height', 'on its own'], '.'], foundAns: [0, 0],
      why: 'The same mass can be healthy for a tall person but too much for a short person. That is why BMI uses both mass and height.' },
  ],
});
})();
</script>
