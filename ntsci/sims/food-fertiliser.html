<title>Fertiliser and plant growth</title>
<div id="nt"></div>
<script>
(() => {
const H = { 0: 10, 1: 16, 2: 20 }, LEAF = { 0: ['pale yellow-green', '#c3cf55'], 1: ['green', '#4fb061'], 2: ['dark green', '#2f8f46'] };
NT.sim({
  title: 'Does fertiliser help?', emoji: '🌱',
  idea: 'Fertilisers add nutrients to the soil. Plants need nutrients for healthy growth.',
  controls: [{ id: 'fert', label: 'Fertiliser added', noun: 'the amount of fertiliser', value: 1, options: [[0, 'None'], [1, '1 spoon', '🥄'], [2, '2 spoons', '🥄']] }],
  go: { label: 'Grow for 14 days', time: 5 },
  readings: [
    { id: 'h', label: 'Height after 14 days', noun: 'the height of the plant', unit: 'cm', get: s => H[s.fert] },
    { id: 'leaf', label: 'Leaves', get: s => LEAF[s.fert][0] },
  ],
  draw(P, s, p) {
    const C = P.C, k = 12, base = 380, h = (2 + (H[s.fert] - 2) * p) * k, day = Math.round(p * 14);
    P.rect(0, 0, 900, 430, { fill: '#eaf6ff' }); P.rect(0, 426, 900, 54, { fill: '#d9c7a8' });
    P.emoji('☀️', 110, 90, 90); P.emoji('🚿', 700, 150, 70); P.text('same light', 110, 160, { size: 16, color: C.mute }); P.text('same water', 700, 205, { size: 16, color: C.mute });
    // ruler
    P.rect(540, base - 26 * k, 34, 26 * k, { fill: '#fff8d6', stroke: C.dark, lw: 3 }); for (let c = 0; c <= 25; c += 5) { P.line(540, base - c * k, 556, base - c * k, { color: C.dark, lw: 2 }); P.text(String(c), 590, base - c * k, { size: 15, color: C.mute, align: 'left' }); } P.text('cm', 557, base - 26 * k - 14, { size: 15, color: C.mute });
    P.plant(430, base, h, { color: LEAF[s.fert][1] });
    P.line(430, base - h, 540, base - h, { color: C.red, lw: 2, dash: [6, 6] });
    for (let i = 0; i < s.fert; i++) P.emoji('🥄', 330 + i * 36, 400, 34); P.text(s.fert ? 'fertiliser' : 'no fertiliser', 350, 440, { size: 16, color: C.mute });
    P.tag('Day ' + day, 800, 60, { bg: C.ink, size: 22 });
  },
  inquiry: [{
    q: 'Does fertiliser help a plant grow taller?',
    guess: ['More fertiliser → taller plant', 'More fertiliser → shorter plant', 'Fertiliser makes no difference'], guessAns: 0,
    change: 'fert', measure: 'h',
    same: ['the same kind of plant', 'the same amount of water', 'the same amount of light', 'the same soil and pot'],
    found: ['Plants given fertiliser grow ', ['taller', 'shorter'], '. Fertiliser adds ', ['nutrients', 'light'], ' to the soil.'], foundAns: [0, 0],
    why: 'Fertilisers add nutrients, so farmers get more crops. But fertiliser washed into rivers and ponds makes algae and water weeds grow too much.',
  }],
});
})();
</script>
