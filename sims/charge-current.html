<title>Charge and Current Lab</title>
<meta charset="utf-8">

<header>
  <h1>Charge and Current Lab</h1>
  <span class="lo">5086 · 12a–12j · charges, current as flow of charge, Q = It, V = IR, resistance of a wire</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="500" aria-label="Charges attracting or repelling, or a circuit with moving charges"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button data-v="charges" aria-pressed="true">Charges</button>
        <button data-v="current" aria-pressed="false">Current in a wire</button>
      </div>
    </div>

    <div id="chCtl" style="display:flex;flex-direction:column;gap:14px">
      <div class="ctl">
        <span class="lbl">Left ball</span>
        <div class="seg" id="qa"><button data-v="1" aria-pressed="true">+</button><button data-v="-1" aria-pressed="false">−</button></div>
      </div>
      <div class="ctl">
        <span class="lbl">Right ball</span>
        <div class="seg" id="qb"><button data-v="1" aria-pressed="false">+</button><button data-v="-1" aria-pressed="true">−</button></div>
      </div>
      <div class="read">
        <div><small>Result</small><span id="rRes">–</span></div>
        <div><small>Unit of charge</small><span>coulomb (C)</span></div>
      </div>
    </div>

    <div id="cuCtl" class="hide" style="flex-direction:column;gap:14px">
      <div class="ctl">
        <div class="row"><label for="emf">e.m.f. of battery</label><span class="val" id="emfV">6 V</span></div>
        <input type="range" id="emf" min="0" max="12" step="0.5" value="6">
      </div>
      <div class="ctl">
        <div class="row"><label for="len">Length of resistance wire</label><span class="val" id="lenV">50 cm</span></div>
        <input type="range" id="len" min="10" max="100" step="10" value="50">
      </div>
      <div class="ctl">
        <span class="lbl">Thickness of wire</span>
        <div class="seg three" id="thick">
          <button data-v="1" aria-pressed="false">thin</button><button data-v="2" aria-pressed="true">medium</button><button data-v="4" aria-pressed="false">thick (4× area)</button>
        </div>
      </div>
      <div class="ctl">
        <span class="lbl">Show the flow as</span>
        <div class="seg" id="flow">
          <button data-v="e" aria-pressed="true">electrons (−)</button><button data-v="c" aria-pressed="false">conventional current</button>
        </div>
      </div>
      <div class="read">
        <div><small>Resistance R</small><span id="rR">–</span></div>
        <div><small>Current I = V ÷ R</small><span id="rI">–</span></div>
        <div><small>Time t</small><span id="rT">–</span></div>
        <div><small>Charge Q = I × t</small><span id="rQ">–</span></div>
      </div>
      <div class="buttons">
        <button class="btn primary" id="play">Pause</button>
        <button class="btn" id="reset">Reset counter</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode='charges', qa=1, qb=-1, thick=2, flow='e', running=true, t=0, Q=0, last=performance.now(), sep=0, phase=0;

function drawCharges(dt){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),hot=css('--hot'),cold=css('--cold');
  ctx.clearRect(0,0,W,H);
  const attract=qa!==qb; const target=attract?-40:40; sep+= (target-sep)*Math.min(1,dt*2);
  const cy=230, ax=330-sep, bx=570+sep;
  const ball=(x,q)=>{ ctx.fillStyle=q>0?hot:cold; ctx.beginPath(); ctx.arc(x,cy,46,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 44px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(q>0?'+':'−', x, cy+16); };
  ball(ax,qa); ball(bx,qb);
  // force arrows
  const arrow=(x,d)=>{ const L=90; ctx.strokeStyle=fg; ctx.fillStyle=fg; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,cy-80); ctx.lineTo(x+d*L,cy-80); ctx.stroke(); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+d*(L+14),cy-80); ctx.lineTo(x+d*L,cy-90); ctx.lineTo(x+d*L,cy-70); ctx.fill(); };
  arrow(ax, attract?1:-1); arrow(bx, attract?-1:1);
  ctx.fillStyle=fg; ctx.font='600 20px Bricolage Grotesque, sans-serif'; ctx.textAlign='center';
  ctx.fillText(attract?'Unlike charges attract':'Like charges repel', W/2, 70);
  ctx.fillStyle=muted; ctx.font='13px IBM Plex Sans, sans-serif';
  ctx.fillText('The arrows show the electric force on each ball. The forces are equal in size and opposite in direction.', W/2, 360);
  ctx.fillText('Charge is measured in coulombs (C). One electron carries a tiny negative charge; a coulomb is about 6 × 10¹⁸ of them.', W/2, 384);
  $('rRes').textContent=attract?'attract':'repel';
}

function R(){ return 0.2*(+$('len').value)/thick; } // 50 cm medium → 5 Ω
function drawCurrent(dt){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),hot=css('--hot'),cold=css('--cold');
  const V=+$('emf').value, r=R(), I=V/r; if (running){ t+=dt; Q+=I*dt; phase+=I*dt*0.5; }
  ctx.clearRect(0,0,W,H);
  // circuit rectangle
  const L=120, Rr=780, T=90, B=360; ctx.strokeStyle=fg; ctx.lineWidth=3; ctx.beginPath(); ctx.rect(L,T,Rr-L,B-T); ctx.stroke(); ctx.lineWidth=1;
  // battery at bottom centre
  const bx=450; ctx.fillStyle=css('--panel'); ctx.fillRect(bx-40,B-20,80,40);
  ctx.strokeStyle=fg; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx-12,B-26); ctx.lineTo(bx-12,B+26); ctx.stroke(); ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(bx+12,B-14); ctx.lineTo(bx+12,B+14); ctx.stroke(); ctx.lineWidth=1;
  ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('+', bx-24, B+42); ctx.fillText('−', bx+24, B+42); ctx.fillText(V+' V', bx, B-30);
  // resistance wire at top: length ∝ slider, thickness ∝ thick
  const wl=(+$('len').value)/100*400, wx=450-wl/2; ctx.fillStyle=css('--panel'); ctx.fillRect(wx-4,T-16,wl+8,32);
  ctx.strokeStyle=hot; ctx.lineWidth=2+thick*2; ctx.beginPath(); ctx.moveTo(wx,T); ctx.lineTo(wx+wl,T); ctx.stroke(); ctx.lineWidth=1;
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText(`resistance wire · ${$('len').value} cm · ${thick===1?'thin':thick===2?'medium':'thick'} · R = ${r.toFixed(1)} Ω`, 450, T-24);
  // ammeter on the right side
  ctx.fillStyle=css('--panel'); ctx.beginPath(); ctx.arc(Rr,225,28,0,7); ctx.fill(); ctx.strokeStyle=fg; ctx.stroke(); ctx.fillStyle=fg; ctx.font='700 18px IBM Plex Sans, sans-serif'; ctx.fillText('A', Rr, 232);
  ctx.font='12px IBM Plex Mono, monospace'; ctx.fillText(I.toFixed(2)+' A', Rr, 275);
  // moving charges along the loop
  const perim=2*((Rr-L)+(B-T)); const n=Math.round(perim/28);
  const pos=s=>{ s=((s%perim)+perim)%perim; if (s<(Rr-L)) return [L+s,T]; s-=(Rr-L); if (s<(B-T)) return [Rr,T+s]; s-=(B-T); if (s<(Rr-L)) return [Rr-s,B]; s-=(Rr-L); return [L,B-s]; };
  // conventional current: clockwise? battery + is on the left (bx-24) so conventional current leaves + and goes left along the bottom → anticlockwise... define: conventional current flows from + (left) around: bottom-left → up left side → top → down right side → back to − (right). That is clockwise in screen coords starting at bottom-left going up.
  const dirSign = flow==='c' ? 1 : -1; // s increases clockwise (top L→R, right T→B, bottom R→L, left B→T)
  for (let i=0;i<n;i++){ const s=i*perim/n + dirSign*phase*60; const [x,y]=pos(s); if (Math.abs(x-bx)<40 && y===B) continue; if (y===T && x>wx && x<wx+wl && (i%2)) continue;
    ctx.fillStyle=flow==='e'?cold:hot; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='700 9px IBM Plex Sans, sans-serif'; ctx.fillText(flow==='e'?'−':'+', x, y+3); }
  // direction label
  ctx.fillStyle=flow==='e'?cold:hot; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText(flow==='e' ? 'Electron flow: − terminal → around → + terminal' : 'Conventional current: + terminal → around → − terminal (the opposite way to the electrons)', L, B+70);
  ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif';
  ctx.fillText(`Current I = rate of flow of charge. Here ${I.toFixed(2)} C passes the ammeter every second. Charge so far: Q = I × t = ${I.toFixed(2)} × ${t.toFixed(0)} = ${Q.toFixed(0)} C`, L, B+96);
  ctx.fillStyle=muted; ctx.fillText('Make the wire longer: more resistance, smaller current, slower dots. Make it thicker: less resistance.', L, B+120);
  $('rR').textContent=r.toFixed(1)+' Ω'; $('rI').textContent=(V? I.toFixed(2):'0.00')+' A'; $('rT').textContent=t.toFixed(0)+' s'; $('rQ').textContent=Q.toFixed(0)+' C';
}
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (mode==='charges') drawCharges(dt); else drawCurrent(dt); requestAnimationFrame(frame); }
function notice(){ $('notice').innerHTML = mode==='charges'
  ? '<b>What to notice.</b> There are two kinds of charge, positive and negative. Like charges repel, unlike charges attract. Charge is measured in coulombs.'
  : '<b>What to notice.</b> Current is the rate of flow of charge (I = Q/t, in amperes = coulombs per second). Electrons flow from − to +; conventional current is drawn the other way, from + to −. The current depends on the e.m.f. and the resistance: I = V/R. A longer wire has more resistance; a thicker wire has less.'; }
const seg=(id,fn)=>$(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b)); fn(b.dataset.v); });
seg('modeSeg',v=>{ mode=v; $('chCtl').classList.toggle('hide',mode!=='charges'); $('cuCtl').classList.toggle('hide',mode!=='current'); $('cuCtl').style.display=mode==='current'?'flex':''; notice(); });
seg('qa',v=>qa=+v); seg('qb',v=>qb=+v); seg('thick',v=>thick=+v); seg('flow',v=>flow=v);
$('emf').addEventListener('input',()=>$('emfV').textContent=$('emf').value+' V');
$('len').addEventListener('input',()=>$('lenV').textContent=$('len').value+' cm');
$('play').addEventListener('click',()=>{ running=!running; $('play').textContent=running?'Pause':'Play'; });
$('reset').addEventListener('click',()=>{ t=0; Q=0; });
notice(); requestAnimationFrame(frame);
})();
</script>
