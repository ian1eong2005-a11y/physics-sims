<title>Ray Box Bench</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: lab bench. Wide canvas stage on the left, instrument panel on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --ray:#e4572e; --glass:#2a7de1; --normal:#5b6675; --angle:#2e9e5b; --mystery:#7b3fe4;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--ray:#ff7a50;--glass:#5aa6ff;--normal:#98a4b3;--angle:#4cc078;--mystery:#b08cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--ray:#ff7a50;--glass:#5aa6ff;--normal:#98a4b3;--angle:#4cc078;--mystery:#b08cff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.buttons{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.read div{background:var(--bg);border-radius:8px;padding:8px 4px}
.read span{display:block;font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums}
.read small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;text-transform:lowercase}
td:first-child,th:first-child{text-align:left}
</style>

<header>
  <h1>Ray Box Bench</h1>
  <span class="lo">5086 · 11a–11e · reflection, refraction and refractive index</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="520" aria-label="Ray box shining a ray at a mirror or a glass block"></canvas>
    <p class="notice" id="notice"></p>
  </div>

  <div class="panel">
    <div class="ctl">
      <span class="lbl">Set-up</span>
      <div class="seg" id="modeSeg">
        <button data-v="mirror" aria-pressed="false">Plane mirror</button>
        <button data-v="block" aria-pressed="true">Glass block</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="inc">Angle of incidence i</label><span class="val" id="incV">40°</span></div>
      <input type="range" id="inc" min="0" max="80" step="1" value="40">
    </div>
    <div class="ctl" id="matWrap">
      <label for="mat">Block material</label>
      <select id="mat">
        <option value="1.50">Glass (n = 1.50)</option>
        <option value="1.33">Water (n = 1.33)</option>
        <option value="1.49">Perspex (n = 1.49)</option>
        <option value="2.42">Diamond (n = 2.42)</option>
        <option value="mystery">Mystery block (find n)</option>
      </select>
    </div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="normal" checked> Show the normal</label>
      <label class="check"><input type="checkbox" id="angles" checked> Show angle values</label>
      <label class="check"><input type="checkbox" id="partial" checked> Show weak reflected ray at the block</label>
    </div>
    <div class="read" id="reads">
      <div><small>sin i</small><span id="sinI">–</span></div>
      <div><small>sin r</small><span id="sinR">–</span></div>
      <div><small>sin i ÷ sin r</small><span id="ratio">–</span></div>
      <div><small>Speed in block</small><span id="vmed">–</span></div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="record">Record reading</button>
      <button class="btn" id="reveal" disabled>Reveal n</button>
    </div>
    <table id="tbl"><thead><tr><th>i</th><th>r</th><th>sin i</th><th>sin r</th><th>ratio</th></tr></thead><tbody></tbody></table>
    <button class="btn" id="clearT">Clear table</button>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
let mode='block', mysteryN=1.62, revealed=false, rows=[];
const nVal=()=>$('mat').value==='mystery'?mysteryN:+$('mat').value;
const isMystery=()=>$('mat').value==='mystery'&&!revealed;

// geometry: the surface is the horizontal line y=SY; the point of incidence is (PX,SY)
const PX=450, SY=230, BLOCK_H=170, BLOCK_W=520;
function ray(x0,y0,ang,len,col,width,dash){ // ang measured from +x axis, screen coords (y down)
  ctx.strokeStyle=col; ctx.lineWidth=width; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+len*Math.cos(ang), y0+len*Math.sin(ang)); ctx.stroke(); ctx.setLineDash([]);
  // arrowhead at midpoint
  const mx=x0+len*0.55*Math.cos(ang), my=y0+len*0.55*Math.sin(ang); ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(mx+9*Math.cos(ang),my+9*Math.sin(ang)); ctx.lineTo(mx+6*Math.cos(ang+2.5),my+6*Math.sin(ang+2.5)); ctx.lineTo(mx+6*Math.cos(ang-2.5),my+6*Math.sin(ang-2.5)); ctx.fill(); ctx.lineWidth=1;
}
function arc(x,y,r,a0,a1,label,col){ ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r,a0,a1); ctx.stroke(); ctx.lineWidth=1;
  if ($('angles').checked){ const am=(a0+a1)/2; ctx.fillStyle=col; ctx.font='600 13px IBM Plex Mono, monospace'; ctx.textAlign='center'; ctx.fillText(label, x+(r+18)*Math.cos(am), y+(r+18)*Math.sin(am)+4); } }

function draw(){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),rayC=css('--ray'),glass=css('--glass'),norm=css('--normal'),ang=css('--angle'),myst=css('--mystery');
  ctx.clearRect(0,0,W,H);
  const i=+$('inc').value, n=nVal();
  // incident ray comes from upper-left, hits (PX,SY) at angle i to the normal
  const dirIn = Math.PI/2 - rad(i);          // direction of travel: downwards and to the right
  const srcLen=260, sx=PX-srcLen*Math.cos(dirIn), sy=SY-srcLen*Math.sin(dirIn);

  if (mode==='mirror'){
    ctx.fillStyle=line; ctx.fillRect(PX-260,SY,520,8); ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('plane mirror', PX-260, SY+26);
    for (let x=PX-260;x<PX+260;x+=14){ ctx.strokeStyle=muted; ctx.beginPath(); ctx.moveTo(x,SY+8); ctx.lineTo(x-8,SY+18); ctx.stroke(); }
  } else {
    ctx.fillStyle=isMystery()?myst:glass; ctx.globalAlpha=.18; ctx.fillRect(PX-BLOCK_W/2,SY,BLOCK_W,BLOCK_H); ctx.globalAlpha=1; ctx.strokeStyle=isMystery()?myst:glass; ctx.lineWidth=2; ctx.strokeRect(PX-BLOCK_W/2,SY,BLOCK_W,BLOCK_H); ctx.lineWidth=1;
    ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('air', PX-BLOCK_W/2, SY-10); ctx.fillText(isMystery()?'mystery block, n = ?':`block, n = ${n.toFixed(2)}`, PX-BLOCK_W/2+8, SY+BLOCK_H-10);
  }
  // ray box
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(dirIn); ctx.fillStyle=fg; ctx.fillRect(-56,-16,50,32); ctx.fillStyle=css('--panel'); ctx.fillRect(-10,-5,8,10); ctx.restore();
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('ray box', sx-40*Math.cos(dirIn)-20, sy-40*Math.sin(dirIn)-14);
  // normal
  if ($('normal').checked){ ctx.strokeStyle=norm; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(PX,SY-200); ctx.lineTo(PX,SY+(mode==='block'?BLOCK_H:0)+30); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('normal', PX+6, SY-190); }
  // incident ray
  ray(sx,sy,dirIn,srcLen,rayC,3);
  // angle of incidence arc: between the normal (pointing up, angle -π/2) and the incoming ray direction reversed
  const inBack = dirIn+Math.PI; // direction back toward the source
  arc(PX,SY,46,-Math.PI/2,inBack<-Math.PI/2?inBack+2*Math.PI:inBack,'i = '+i+'°',ang);

  let r=null;
  if (mode==='mirror'){
    const dirRef = -Math.PI/2 + rad(i); ray(PX,SY,dirRef,280,rayC,3);
    arc(PX,SY,46,dirRef,-Math.PI/2,'r = '+i+'°',ang);
    $('sinI').textContent=Math.sin(rad(i)).toFixed(3); $('sinR').textContent=Math.sin(rad(i)).toFixed(3); $('ratio').textContent='1.00 (reflection)'; $('vmed').textContent='–';
  } else {
    r = deg(Math.asin(Math.sin(rad(i))/n));
    const dirR = Math.PI/2 - rad(r);
    // path inside the block to the bottom face
    const L = BLOCK_H/Math.sin(dirR); const ex = PX+L*Math.cos(dirR), ey = SY+BLOCK_H;
    ray(PX,SY,dirR,L,rayC,3);
    arc(PX,SY,60,Math.PI/2,dirR,isMystery()?'r = '+r.toFixed(0)+'°':'r = '+r.toFixed(1)+'°',ang);
    if ($('partial').checked){ const dirRef=-Math.PI/2+rad(i); ray(PX,SY,dirRef,200,rayC,1.5,[4,4]); }
    // emergent ray, parallel to the incident ray
    if (ex < PX+BLOCK_W/2){ ray(ex,ey,dirIn,120,rayC,3); if ($('normal').checked){ ctx.strokeStyle=norm; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(ex,ey-60); ctx.lineTo(ex,ey+60); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('emerges parallel to the incident ray, shifted sideways', ex+14, ey+50); }
    const si=Math.sin(rad(i)), sr=Math.sin(rad(r));
    $('sinI').textContent=si.toFixed(3); $('sinR').textContent=sr.toFixed(3); $('ratio').textContent=i===0?'(i = 0: ray not bent)':(si/sr).toFixed(2); $('vmed').textContent=isMystery()?'?':(3e8/n/1e8).toFixed(2)+' × 10⁸ m/s';
  }
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText(mode==='mirror'?'Angles are measured from the normal, never from the surface.':'The ray bends towards the normal when it slows down on entering the block, and away from the normal when it speeds up on leaving.', 40, H-18);
  return r;
}
function notice(){
  $('notice').innerHTML = mode==='mirror'
    ? '<b>What to notice.</b> Angle of reflection = angle of incidence, both measured from the normal. Slide i and watch r match it exactly.'
    : '<b>What to notice.</b> Change i and record several readings. The angles change but sin i ÷ sin r stays the same: that constant is the refractive index n = c ÷ v. The denser the material, the slower the light and the more the ray bends.';
}
function redraw(){ draw(); }
$('modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.v; [...$('modeSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); $('matWrap').hidden=mode==='mirror'; $('record').disabled=mode==='mirror'; notice(); redraw(); });
$('inc').addEventListener('input',()=>{ $('incV').textContent=$('inc').value+'°'; redraw(); });
$('mat').addEventListener('change',()=>{ if ($('mat').value==='mystery'){ mysteryN=[1.36,1.42,1.55,1.62,1.75][Math.floor(Math.random()*5)]; revealed=false; $('reveal').disabled=false; } else { $('reveal').disabled=true; } rows=[]; renderT(); redraw(); });
['normal','angles','partial'].forEach(id=>$(id).addEventListener('change',redraw));
$('reveal').addEventListener('click',()=>{ revealed=true; redraw(); });
function renderT(){ const tb=$('tbl').querySelector('tbody'); tb.innerHTML=rows.map(r=>`<tr><td>${r.i}°</td><td>${r.r.toFixed(1)}°</td><td>${Math.sin(rad(r.i)).toFixed(3)}</td><td>${Math.sin(rad(r.r)).toFixed(3)}</td><td>${r.i===0?'–':(Math.sin(rad(r.i))/Math.sin(rad(r.r))).toFixed(2)}</td></tr>`).join(''); }
$('record').addEventListener('click',()=>{ const i=+$('inc').value; const r=deg(Math.asin(Math.sin(rad(i))/nVal())); rows.push({i,r}); if (rows.length>7) rows.shift(); renderT(); });
$('clearT').addEventListener('click',()=>{ rows=[]; renderT(); });
notice(); redraw();
})();
</script>
