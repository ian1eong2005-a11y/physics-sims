<title>Series and Parallel Bench</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: lab bench. Wide canvas stage on the left, instrument panel on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --wire:#8a6a3a; --charge:#d9a400; --amm:#e4572e; --volt:#2a7de1; --glow:#ffb300;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--wire:#c9a26b;--charge:#ffd24a;--amm:#ff7a50;--volt:#5aa6ff;--glow:#ffc83d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--wire:#c9a26b;--charge:#ffd24a;--amm:#ff7a50;--volt:#5aa6ff;--glow:#ffc83d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:default}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.buttons{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.work{font-family:var(--mono);font-size:.78rem;line-height:1.6;color:var(--muted);white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:8px 10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.res div{background:var(--bg);border-radius:8px;padding:8px 4px}
.res span{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
</style>

<header>
  <h1>Series and Parallel Bench</h1>
  <span class="lo">5086 · 12i, 13b–13g · current, p.d. and effective resistance</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="470" aria-label="Circuit with animated charges and meter readings"></canvas>
    <p class="notice" id="notice"></p>
  </div>

  <div class="panel">
    <div class="ctl">
      <span class="lbl">Number of resistors</span>
      <div class="seg four" id="nSeg">
        <button data-v="1" aria-pressed="false">1</button>
        <button data-v="2" aria-pressed="false">2</button>
        <button data-v="3" aria-pressed="true">3</button>
        <button data-v="4" aria-pressed="false">4</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">Arrangement</span>
      <div class="seg" id="arrSeg">
        <button data-v="series" aria-pressed="true">Series</button>
        <button data-v="parallel" aria-pressed="false">Parallel</button>
        <button data-v="mixed" aria-pressed="false">Mixed</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="emf">E.m.f. of battery</label><span class="val" id="emfV">6.0 V</span></div>
      <input type="range" id="emf" min="1.5" max="12" step="0.5" value="6">
    </div>
    <div class="ctl" id="rSliders"></div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="sw" checked> Main switch closed</label>
      <label class="check" id="swLastWrap"><input type="checkbox" id="swLast" checked> <span id="swLastLabel">Switch on R3 closed</span></label>
      <label class="check"><input type="checkbox" id="lamps"> Draw resistors as lamps (brightness = power)</label>
      <label class="check"><input type="checkbox" id="electron"> Show electron flow instead of conventional current</label>
      <label class="check"><input type="checkbox" id="hide"> Hide meter readings (quiz mode)</label>
    </div>
    <div class="res">
      <div><small>Effective R</small><span id="rR">– Ω</span></div>
      <div><small>Battery current</small><span id="rI">– A</span></div>
    </div>
    <div class="work" id="work"></div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let arr='series', N=3, Rvals=[2,4,6,3];
const S=()=>({E:+$('emf').value, R:Rvals.slice(0,N), sw:$('sw').checked, swLast:$('swLast').checked});
const f=x=>Number.isFinite(x)?(+x.toFixed(2)).toString():'∞';

function buildSliders(){
  const box=$('rSliders'); box.innerHTML='';
  for (let i=0;i<N;i++){ const row=document.createElement('div'); row.className='row'; row.innerHTML=`<label for="r${i}">R${i+1}</label><span class="val" id="r${i}V">${Rvals[i]} Ω</span>`; const inp=document.createElement('input'); inp.type='range'; inp.id='r'+i; inp.min=1; inp.max=12; inp.step=1; inp.value=Rvals[i]; inp.addEventListener('input',()=>{ Rvals[i]=+inp.value; $('r'+i+'V').textContent=Rvals[i]+' Ω'; }); box.appendChild(row); box.appendChild(inp); }
  $('swLastLabel').textContent=`Switch on R${N} closed`; $('swLastWrap').hidden = N===1;
  $('arrSeg').querySelectorAll('button').forEach(b=>{ b.disabled = (N===1 && b.dataset.v!=='series') || (N===2 && b.dataset.v==='mixed'); });
  if (N===1) setArr('series'); else if (N===2 && arr==='mixed') setArr('parallel');
}

// ---- physics. Mixed = R1 in series with the rest in parallel. The last resistor has its own switch.
function solve(){
  const s=S(), R=s.R, out={I:Array(N).fill(0), V:Array(N).fill(0), It:0, Rt:NaN, work:''};
  const lastOn = N===1 ? true : s.swLast;
  if (arr==='series'){
    out.Rt=R.reduce((a,b)=>a+b,0);
    out.work=`Series: R = ${R.map((_,i)=>'R'+(i+1)).join(' + ')}\n  = ${R.join(' + ')} = ${out.Rt} Ω\nI = E ÷ R = ${s.E} ÷ ${out.Rt} = ${f(s.E/out.Rt)} A\nSame current everywhere; the p.d.s add up to ${s.E} V`;
    if (s.sw && lastOn){ out.It=s.E/out.Rt; out.I.fill(out.It); out.V=R.map(r=>r*out.It); }
    if (!lastOn && s.sw) out.work+=`\n\nSwitch on R${N} open: the only path is broken, so nothing flows anywhere.`;
  } else if (arr==='parallel'){
    const br=[...Array(N).keys()].filter(i=>i<N-1||lastOn);
    const inv=br.reduce((a,i)=>a+1/R[i],0); out.Rt=1/inv;
    out.work=`Parallel: 1/R = ${br.map(i=>'1/'+R[i]).join(' + ')}\n  = ${f(inv)}  →  R = ${f(out.Rt)} Ω\nSame p.d. (${s.E} V) across every branch\nI_branch = ${s.E} ÷ R_branch; the branch currents add up`;
    if (s.sw){ br.forEach(i=>{ out.V[i]=s.E; out.I[i]=s.E/R[i]; }); out.It=out.I.reduce((a,b)=>a+b,0); }
    if (!lastOn) out.work+=`\n\nR${N} switched off: the other branches still get the full e.m.f., so they are unaffected.`;
  } else {
    const br=[...Array(N).keys()].slice(1).filter(i=>i<N-1||lastOn);
    const inv=br.reduce((a,i)=>a+1/R[i],0), Rp=1/inv; out.Rt=R[0]+Rp;
    out.work=`Parallel part (${br.map(i=>'R'+(i+1)).join(' ∥ ')}): 1/Rp = ${br.map(i=>'1/'+R[i]).join(' + ')}  →  Rp = ${f(Rp)} Ω\nThen in series with R1: R = ${R[0]} + ${f(Rp)} = ${f(out.Rt)} Ω\nI = ${s.E} ÷ ${f(out.Rt)} = ${f(s.E/out.Rt)} A through R1\np.d. across R1 = I × R1; the rest of the ${s.E} V is across the parallel part`;
    if (s.sw){ out.It=s.E/out.Rt; out.I[0]=out.It; out.V[0]=out.It*R[0]; const Vp=out.It*Rp; br.forEach(i=>{ out.V[i]=Vp; out.I[i]=Vp/R[i]; }); }
  }
  if (!s.sw) out.work+='\n\nMain switch open: no complete path, so every current is 0 A.';
  return out;
}

// ---- geometry: wires as point lists with components placed on them
const L=120, Rr=780, T=110, GAP=90;
function layout(){
  const w=[];
  const branches = arr==='parallel' ? N : arr==='mixed' ? N-1 : 1;
  const B = Math.max(390, T + GAP*(branches-1) + 110);
  cv.height = B + 80;
  const cell={type:'cell',at:[L,(T+B)/2],dir:'v'};
  if (arr==='series'){
    const xs=[...Array(N).keys()].map(i=>200+ (i+1)*(560/(N+1)));
    const comps=[cell,...xs.map((x,i)=>({type:'R',idx:i,at:[x,T]})),{type:'sw',at:[450,B]},{type:'A',at:[300,B],cur:'main'}];
    if (N>1) comps.push({type:'swLast',at:[xs[N-1]+70,T]});
    w.push({pts:[[L,(T+B)/2],[L,T],[Rr,T],[Rr,B],[L,B],[L,(T+B)/2]], cur:'main', comps});
  } else {
    const ax = arr==='mixed'?380:300, bx = arr==='mixed'?640:600, A=[ax,T], Bj=[bx,T];
    const first={pts:[[L,(T+B)/2],[L,T],A], cur:'main', comps:[cell]};
    if (arr==='mixed') first.comps.push({type:'R',idx:0,at:[250,T]});
    w.push(first);
    w.push({pts:[Bj,[Rr,T],[Rr,B],[L,B],[L,(T+B)/2]], cur:'main', comps:[{type:'sw',at:[450,B]},{type:'A',at:[650,B],cur:'main'}]});
    const start = arr==='mixed'?1:0, mid=(ax+bx)/2;
    for (let k=0;k<branches;k++){ const i=start+k, y=T+GAP*k; const comps=[{type:'R',idx:i,at:[mid,y]},{type:'A',at:[ax+70,y],cur:i}]; if (i===N-1 && N>1) comps.push({type:'swLast',at:[mid+90,y]}); w.push({pts:[A,[ax,y],[bx,y],Bj], cur:i, comps}); }
  }
  for (const wire of w){ wire.len=0; wire.seg=[]; for (let i=1;i<wire.pts.length;i++){ const [a,b]=[wire.pts[i-1],wire.pts[i]]; const l=Math.hypot(b[0]-a[0],b[1]-a[1]); wire.seg.push(l); wire.len+=l; } }
  return w;
}
const pointAt=(wire,d)=>{ d=((d%wire.len)+wire.len)%wire.len; for (let i=0;i<wire.seg.length;i++){ if (d<=wire.seg[i]){ const [a,b]=[wire.pts[i],wire.pts[i+1]], fr=d/wire.seg[i]; return [a[0]+(b[0]-a[0])*fr, a[1]+(b[1]-a[1])*fr]; } d-=wire.seg[i]; } return wire.pts[wire.pts.length-1]; };

let wires=layout(), offsets=0, dirty=false;
const SPACING=26;

function drawComp(c, sol, s){
  const fg=css('--fg'), panel=css('--panel'), amm=css('--amm'), volt=css('--volt'), glow=css('--glow'), muted=css('--muted');
  const [x,y]=c.at; const hide=$('hide').checked;
  ctx.lineWidth=2; ctx.strokeStyle=fg; ctx.fillStyle=panel; ctx.textAlign='center';
  if (c.type==='cell'){ ctx.fillRect(x-14,y-24,28,48); ctx.beginPath(); ctx.moveTo(x-18,y-8); ctx.lineTo(x+18,y-8); ctx.moveTo(x-9,y+8); ctx.lineTo(x+9,y+8); ctx.lineWidth=3; ctx.stroke(); ctx.lineWidth=2;
    ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.textAlign='left'; ctx.fillText('+', x+22, y-10); ctx.fillText(s.E.toFixed(1)+' V', x+24, y+12); return; }
  if (c.type==='sw'||c.type==='swLast'){ const closed = c.type==='sw'?s.sw:s.swLast; ctx.fillRect(x-22,y-14,44,28); ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(x-16,y,3,0,7); ctx.arc(x+16,y,3,0,7); ctx.fill(); ctx.beginPath(); ctx.moveTo(x-16,y); if (closed) ctx.lineTo(x+16,y); else ctx.lineTo(x+10,y-16); ctx.stroke();
    ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText(c.type==='sw'?'switch':`switch (R${N})`, x, y+26); return; }
  if (c.type==='A'){ const I=c.cur==='main'?sol.It:sol.I[c.cur]; ctx.beginPath(); ctx.arc(x,y,15,0,7); ctx.fill(); ctx.strokeStyle=amm; ctx.stroke(); ctx.fillStyle=amm; ctx.font='600 13px IBM Plex Mono, monospace'; ctx.fillText('A', x, y+5);
    ctx.font='600 12px IBM Plex Mono, monospace'; ctx.fillText(hide?'? A':I.toFixed(2)+' A', x, y-22); return; }
  if (c.type==='R'){ const i=c.idx, R=s.R[i], V=sol.V[i], I=sol.I[i], P=V*I;
    if ($('lamps').checked){ if (P>0.01){ const rad=16+Math.min(40,P*3), g=ctx.createRadialGradient(x,y,4,x,y,rad); g.addColorStop(0,glow); g.addColorStop(1,'rgba(255,179,0,0)'); ctx.fillStyle=g; ctx.globalAlpha=Math.min(1,0.25+P/8); ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill(); ctx.globalAlpha=1; }
      ctx.fillStyle=panel; ctx.beginPath(); ctx.arc(x,y,14,0,7); ctx.fill(); ctx.strokeStyle=fg; ctx.stroke(); ctx.beginPath(); ctx.moveTo(x-10,y-10); ctx.lineTo(x+10,y+10); ctx.moveTo(x+10,y-10); ctx.lineTo(x-10,y+10); ctx.stroke(); }
    else { ctx.fillRect(x-24,y-9,48,18); ctx.strokeRect(x-24,y-9,48,18); }
    ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.fillText(`R${i+1} = ${R} Ω`, x, y+32);
    ctx.strokeStyle=volt; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x-30,y); ctx.lineTo(x-30,y-28); ctx.lineTo(x-12,y-28); ctx.moveTo(x+30,y); ctx.lineTo(x+30,y-28); ctx.lineTo(x+12,y-28); ctx.stroke();
    ctx.fillStyle=panel; ctx.beginPath(); ctx.arc(x,y-28,12,0,7); ctx.fill(); ctx.strokeStyle=volt; ctx.stroke(); ctx.fillStyle=volt; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.fillText('V', x, y-24);
    ctx.fillText(hide?'? V':V.toFixed(2)+' V', x, y-46); ctx.lineWidth=2; }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (dirty){ wires=layout(); dirty=false; }
  const s=S(), sol=solve(), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const wireC=css('--wire'), chargeC=css('--charge'), fg=css('--fg'), muted=css('--muted');
  offsets += dt*55;
  const dir = $('electron').checked ? -1 : 1;
  ctx.strokeStyle=wireC; ctx.lineWidth=3; ctx.lineJoin='round';
  for (const w of wires){ ctx.beginPath(); w.pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.stroke(); }
  if (arr!=='series'){ ctx.fillStyle=wireC; for (const p of [wires[0].pts[wires[0].pts.length-1], wires[1].pts[0]]){ ctx.beginPath(); ctx.arc(p[0],p[1],5,0,7); ctx.fill(); } }
  for (const w of wires){ const I = w.cur==='main'?sol.It:sol.I[w.cur]; const n=Math.round(w.len/SPACING); const shift = dir*offsets*I;
    for (let k=0;k<n;k++){ const [x,y]=pointAt(w, k*w.len/n + shift); ctx.fillStyle=chargeC; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); if ($('electron').checked){ ctx.fillStyle=fg; ctx.fillRect(x-2,y-0.5,4,1); } } }
  for (const w of wires) for (const c of w.comps) drawComp(c, sol, s);
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText($('electron').checked?'Yellow dots: electrons, flowing from − to + (opposite to conventional current).':'Yellow dots: conventional current, flowing from + to −. Their speed shows the size of the current.', 120, H-30);
  $('rR').textContent=(Number.isFinite(sol.Rt)?(+sol.Rt.toFixed(2)):'–')+' Ω'; $('rI').textContent=$('hide').checked?'? A':sol.It.toFixed(2)+' A'; $('work').textContent=sol.work;
  requestAnimationFrame(frame);
}

function notice(){
  const m={series:'<b>Series.</b> One path only. The dots move at the same speed everywhere, so the current is the same at every point. The p.d.s across the resistors add up to the e.m.f., with the largest share across the largest resistance. Open the last switch and everything stops.',
    parallel:'<b>Parallel.</b> The current splits at the first junction and rejoins at the second. Each branch gets the full e.m.f. across it, so the branch with the smallest resistance carries the largest current. Switch off the last branch: the others are unaffected, and the effective resistance goes up.',
    mixed:'<b>Mixed.</b> R1 carries the whole current, which then splits between the parallel resistors. Work out the parallel part first, add R1, then find the current. The p.d. across R1 plus the p.d. across the parallel part equals the e.m.f.'};
  $('notice').innerHTML=m[arr];
}
function setArr(v){ arr=v; [...$('arrSeg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); notice(); dirty=true; }
$('arrSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; setArr(b.dataset.v); });
$('nSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; N=+b.dataset.v; [...$('nSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); buildSliders(); dirty=true; });
$('emf').addEventListener('input',()=>$('emfV').textContent=(+$('emf').value).toFixed(1)+' V');
buildSliders(); notice(); requestAnimationFrame(frame);
})();
</script>
