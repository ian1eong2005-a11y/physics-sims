<title>Lens Bench</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --ray:#e4572e; --ray2:#2e9e5b; --ray3:#7b3fe4; --lens:#2a7de1; --obj:#1d2430; --img:#d9a400;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--ray:#ff7a50;--ray2:#4cc078;--ray3:#b08cff;--lens:#5aa6ff;--obj:#e8edf3;--img:#ffd24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--ray:#ff7a50;--ray2:#4cc078;--ray3:#b08cff;--lens:#5aa6ff;--obj:#e8edf3;--img:#ffd24a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.card{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.9rem}
.card b{display:block;font-family:var(--display);font-size:1rem;margin-bottom:4px}
.tag{display:inline-block;font-family:var(--mono);font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin:2px 4px 2px 0}
[hidden]{display:none!important}
</style>

<header>
  <h1>Lens Bench</h1>
  <span class="lo">5086 · 11f–11h · converging lens, focal length, image characteristics</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="440" aria-label="Converging lens with rays"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Set-up</span>
      <div class="seg" id="modeSeg">
        <button data-v="beam" aria-pressed="false">Parallel beam</button>
        <button data-v="object" aria-pressed="true">Object and image</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="f">Focal length f</label><span class="val" id="fV">8 cm</span></div>
      <input type="range" id="f" min="5" max="12" step="1" value="8">
    </div>
    <div class="ctl" id="uWrap">
      <div class="row"><label for="u">Object distance u</label><span class="val" id="uV">20 cm</span></div>
      <input type="range" id="u" min="3" max="40" step="1" value="20">
    </div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="rays" checked> Show the three construction rays</label>
      <label class="check"><input type="checkbox" id="chars" checked> Describe the image</label>
    </div>
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode='object';
const PX=14;                        // px per cm
const LX=450, AX=250;               // lens position, principal axis
const S=()=>({f:+$('f').value, u:+$('u').value});
const line=(x1,y1,x2,y2,col,w=2,dash)=>{ ctx.strokeStyle=col; ctx.lineWidth=w; if(dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1; };
const arrowHead=(x,y,ang,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x+8*Math.cos(ang),y+8*Math.sin(ang)); ctx.lineTo(x+6*Math.cos(ang+2.5),y+6*Math.sin(ang+2.5)); ctx.lineTo(x+6*Math.cos(ang-2.5),y+6*Math.sin(ang-2.5)); ctx.fill(); };
const ray=(x1,y1,x2,y2,col,dash)=>{ line(x1,y1,x2,y2,col,2,dash); if(!dash){ const mx=(x1+x2)/2,my=(y1+y2)/2; arrowHead(mx,my,Math.atan2(y2-y1,x2-x1),col); } };

function draw(){
  const W=cv.width,H=cv.height,s=S(), fg=css('--fg'),muted=css('--muted'),ln=css('--line'),lens=css('--lens'),r1=css('--ray'),r2=css('--ray2'),r3=css('--ray3'),obj=css('--obj'),img=css('--img');
  ctx.clearRect(0,0,W,H);
  const fpx=s.f*PX;
  // axis, lens, F and 2F
  line(20,AX,W-20,AX,ln,1,[4,4]);
  ctx.fillStyle=lens; ctx.globalAlpha=.25; ctx.beginPath(); ctx.ellipse(LX,AX,14,120,0,0,7); ctx.fill(); ctx.globalAlpha=1; ctx.strokeStyle=lens; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1;
  ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.textAlign='center';
  for (const [k,l] of [[-2,'2F'],[-1,'F'],[1,'F'],[2,'2F']]){ const x=LX+k*fpx; ctx.fillRect(x-1,AX-6,2,12); ctx.fillText(l, x, AX+26); }
  ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText('converging lens', LX, AX-130);
  // focal length bracket
  line(LX,AX+44,LX+fpx,AX+44,fg,1.5); line(LX,AX+39,LX,AX+49,fg,1.5); line(LX+fpx,AX+39,LX+fpx,AX+49,fg,1.5); ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.fillText(`f = ${s.f} cm`, LX+fpx/2, AX+62);

  if (mode==='beam'){
    for (let k=-3;k<=3;k++){ const y=AX+k*28; ray(30,y,LX,y,r1); const t=(W-20-LX)/fpx; ray(LX,y,W-20,AX+(y-AX)*(1-t),r1); }
    ctx.fillStyle=r1; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('parallel rays (e.g. from a very distant object)', 30, AX-110);
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(LX+fpx,AX,5,0,7); ctx.fill(); ctx.textAlign='center'; ctx.fillText('principal focus F', LX+fpx, AX-18);
    $('card').innerHTML='<b>Action of a converging lens</b>Rays parallel to the principal axis are refracted so that they converge to one point, the <b>principal focus F</b>. The distance from the centre of the lens to F is the <b>focal length f</b>. A fatter (more curved) lens has a shorter focal length.';
    return;
  }
  // object and image
  const u=s.u, hob=50; const ox=LX-u*PX;
  ctx.fillStyle=obj; line(ox,AX,ox,AX-hob,obj,3); arrowHead(ox,AX-hob,-Math.PI/2,obj); ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('object', ox, AX-hob-12);
  let v, hi, real;
  if (Math.abs(u-s.f)<0.01){ v=Infinity; }
  else { v = 1/(1/s.f-1/u); hi = -hob*v/u; real = v>0; }
  const topY=AX-hob;
  if ($('rays').checked){
    if (v===Infinity){ ray(ox,topY,LX,topY,r1); ray(LX,topY,W-20,topY+(W-20-LX)*(hob/fpx),r1); ray(ox,topY,W-20,AX+(W-20-LX)*(hob/(LX-ox)),r2); }
    else {
      const ix=LX+v*PX, iy=AX-hi;
      // ray 1: parallel to axis then through F
      ray(ox,topY,LX,topY,r1); if (real) ray(LX,topY,ix,iy,r1); else { ray(LX,topY,W-20,topY+(W-20-LX)*(hob/fpx),r1); ray(LX,topY,ix,iy,r1,[5,4]); }
      // ray 2: through the optical centre, undeviated
      if (real) ray(ox,topY,ix,iy,r2); else { const slope=hob/(LX-ox); ray(ox,topY,W-20,topY+(W-20-ox)*slope,r2); ray(LX,AX,ix,iy,r2,[5,4]); }
      // ray 3: through F on the object side, then parallel
      const Fx=LX-fpx; const slope3=(topY-AX)/(ox-Fx); const yAtLens=topY+(LX-ox)*slope3;
      if (Math.abs(yAtLens-AX)<150){ ray(ox,topY,LX,yAtLens,r3); if (real) ray(LX,yAtLens,ix,yAtLens,r3); else { ray(LX,yAtLens,W-20,yAtLens,r3); ray(LX,yAtLens,ix,yAtLens,r3,[5,4]); } }
    }
  }
  if (v!==Infinity){
    const ix=LX+v*PX, iy=AX-hi;
    if (ix>30 && ix<W-30 && Math.abs(hi)<400){ ctx.globalAlpha=real?1:.75; line(ix,AX,ix,iy,img,3); arrowHead(ix,iy,hi>0?-Math.PI/2:Math.PI/2,img); ctx.globalAlpha=1; ctx.fillStyle=img; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(real?'real image':'virtual image', ix, hi>0?iy-12:iy+18); }
    else { ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('image is off the screen (very far away)', LX+40, 40); }
  } else { ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('object at F: rays leave parallel, so no image forms (it is at infinity)', LX+40, 40); }
  // legend
  ctx.font='11px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  [[r1,'parallel to axis → through F'],[r2,'through optical centre → straight on'],[r3,'through F → parallel to axis']].forEach(([c,l],i)=>{ ctx.fillStyle=c; ctx.fillRect(30,H-60+i*16,18,3); ctx.fillStyle=muted; ctx.fillText(l, 54, H-55+i*16); });
  // description
  if ($('chars').checked){
    let tags;
    if (v===Infinity) tags=['no image (at infinity)'];
    else { const m=Math.abs(hi/hob); tags=[real?'real':'virtual', hi>0?'upright':'inverted', m>1.02?'magnified':m<0.98?'diminished':'same size', `on the ${real?'opposite':'same'} side as the object`]; }
    const where = u>2*s.f?'object beyond 2F':Math.abs(u-2*s.f)<0.01?'object at 2F':u>s.f?'object between F and 2F':Math.abs(u-s.f)<0.01?'object at F':'object inside F (closer than f)';
    $('card').innerHTML=`<b>Image: ${where}</b>${tags.map(t=>'<span class="tag">'+t+'</span>').join('')}<div style="margin-top:8px;color:var(--muted)">Real images form where the rays actually meet and can be caught on a screen. Virtual images are where the rays only appear to come from (dashed), as in a magnifying glass.</div>`;
  } else $('card').innerHTML='<b>Describe the image yourself</b>Is it real or virtual? Upright or inverted? Bigger or smaller than the object? Then tick "Describe the image" to check.';
}
function notice(){ $('notice').innerHTML = mode==='beam'
  ? '<b>What to notice.</b> A converging lens bends parallel rays inwards so they meet at the principal focus. Change the focal length: a shorter f means the rays are bent more.'
  : '<b>What to notice.</b> Move the object. The image is where the rays from the top of the object meet again. Far from the lens the image is real, inverted and small; move the object inside F and the rays spread out, so the image becomes virtual, upright and magnified, like a magnifying glass.'; }
$('modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.v; [...$('modeSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); $('uWrap').hidden=mode==='beam'; $('rays').closest('.ctl').hidden=mode==='beam'; notice(); draw(); });
$('f').addEventListener('input',()=>{ $('fV').textContent=$('f').value+' cm'; draw(); });
$('u').addEventListener('input',()=>{ $('uV').textContent=$('u').value+' cm'; draw(); });
['rays','chars'].forEach(id=>$(id).addEventListener('change',draw));
notice(); draw();
})();
</script>
