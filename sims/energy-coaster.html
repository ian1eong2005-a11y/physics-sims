<title>Energy Coaster</title>
<meta charset="utf-8">

<header>
  <h1>Energy Coaster</h1>
  <span class="lo">5086 · 6a–6e · energy stores, Ek = ½mv², Ep = mgh, conservation, work and power</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="520" aria-label="Roller coaster or crane with energy bars"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button data-v="coaster" aria-pressed="true">Coaster</button>
        <button data-v="crane" aria-pressed="false">Crane (work &amp; power)</button>
      </div>
    </div>

    <div id="coCtl" style="display:flex;flex-direction:column;gap:14px">
      <div class="ctl">
        <div class="row"><label for="h0">Start height</label><span class="val" id="h0V">20 m</span></div>
        <input type="range" id="h0" min="8" max="30" step="1" value="20">
      </div>
      <div class="ctl">
        <div class="row"><label for="mass">Mass of car</label><span class="val" id="massV">100 kg</span></div>
        <input type="range" id="mass" min="50" max="500" step="50" value="100">
      </div>
      <div class="ctl">
        <div class="row"><label for="fric">Friction</label><span class="val" id="fricV">none</span></div>
        <input type="range" id="fric" min="0" max="10" step="1" value="0">
      </div>
      <div class="ctl">
        <label class="check"><input type="checkbox" id="bars" checked> Show energy bars</label>
        <label class="check"><input type="checkbox" id="nums" checked> Show numbers</label>
      </div>
      <div class="read">
        <div><small>Height</small><span id="rH">–</span></div>
        <div><small>Speed</small><span id="rV">–</span></div>
        <div><small>Ep = mgh</small><span id="rEp">–</span></div>
        <div><small>Ek = ½mv²</small><span id="rEk">–</span></div>
      </div>
    </div>

    <div id="crCtl" class="hide" style="flex-direction:column;gap:14px">
      <div class="ctl">
        <div class="row"><label for="cm">Mass of crate</label><span class="val" id="cmV">200 kg</span></div>
        <input type="range" id="cm" min="50" max="1000" step="50" value="200">
      </div>
      <div class="ctl">
        <div class="row"><label for="ch">Lift height</label><span class="val" id="chV">10 m</span></div>
        <input type="range" id="ch" min="2" max="20" step="1" value="10">
      </div>
      <div class="ctl">
        <div class="row"><label for="ct">Time taken</label><span class="val" id="ctV">5 s</span></div>
        <input type="range" id="ct" min="2" max="20" step="1" value="5">
      </div>
      <div class="read">
        <div><small>Force = weight</small><span id="rF">–</span></div>
        <div><small>Work = F × d</small><span id="rWd">–</span></div>
        <div><small>Power = W ÷ t</small><span id="rPw">–</span></div>
        <div><small>Ep gained</small><span id="rEpg">–</span></div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="play">Pause</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const g=10;
let mode='coaster', running=true;
// track: height (m) as a function of x (m), 0..100
const track=x=>{ const s=x/100; return 30*Math.exp(-Math.pow((s-0.02)*6,2)) + 14*Math.exp(-Math.pow((s-0.45)*5,2)) + 20*Math.exp(-Math.pow((s-0.78)*7,2)) + 2; };
let x=2, dir=1, v=0, lost=0, last=performance.now(), ct=0;
function h0(){ return +$('h0').value; }
function reset(){ x=2; dir=1; v=0; lost=0; ct=0; }
function stepCoaster(dt){
  const m=+$('mass').value, k=+$('fric').value*0.004; // energy lost per metre as fraction of total
  const H=Math.max(h0(), track(x)); const Etot=m*g*h0();
  const h=track(x); let Ek=Etot-m*g*h-lost;
  if (Ek<=0){ Ek=0; dir=-dir; } v=Math.sqrt(2*Ek/m);
  const slope=(track(x+0.1)-track(x-0.1))/0.2; const dx=v*dt/Math.sqrt(1+slope*slope)*dir;
  x+=dx; if (x<0.5){ x=0.5; dir=1; } if (x>99.5){ x=99.5; dir=-1; }
  lost=Math.min(Etot, lost + Math.abs(dx)*k*Etot/ (1));
  if (Etot-lost<=0.5){ v=0; }
}
function drawCoaster(){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),hot=css('--hot'),good=css('--good');
  const m=+$('mass').value; const Etot=m*g*h0(); const h=track(x); const Ep=m*g*h, Ek=Math.max(0,Etot-Ep-lost);
  ctx.clearRect(0,0,W,H);
  const px=X=>40+X/100*560, py=Y=>380-Y/32*300;
  // ground and track
  ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(40,380); ctx.lineTo(600,380); ctx.stroke();
  ctx.strokeStyle=fg; ctx.lineWidth=3; ctx.beginPath(); for(let X=0;X<=100;X+=0.5){ const yy=py(track(X)); X?ctx.lineTo(px(X),yy):ctx.moveTo(px(X),yy);} ctx.stroke(); ctx.lineWidth=1;
  // start height marker
  ctx.strokeStyle=acc; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(40,py(h0())); ctx.lineTo(600,py(h0())); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=acc; ctx.font='11px IBM Plex Mono, monospace'; ctx.textAlign='left'; ctx.fillText('start height '+h0()+' m', 44, py(h0())-4);
  // height axis
  ctx.fillStyle=muted; ctx.textAlign='right'; for (const Y of [0,10,20,30]) ctx.fillText(Y+' m', 36, py(Y)+4);
  // car
  const cx=px(x), cy=py(h)-10; ctx.fillStyle=hot; ctx.beginPath(); ctx.arc(cx,cy,10,0,7); ctx.fill();
  // speed arrow
  if (v>0.2){ const L=v*4; ctx.strokeStyle=hot; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cy-18); ctx.lineTo(cx+dir*L,cy-18); ctx.stroke(); ctx.lineWidth=1; }
  // labels A B C D at hills/valleys
  ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center';
  [['A',2],['B',25],['C',45],['D',62],['E',78],['F',98]].forEach(([L,X])=>ctx.fillText(L, px(X), py(track(X))-24));
  // bars
  if ($('bars').checked){ const bx=660, by=60, bw=50, bh=280; const bar=(i,val,col,lab)=>{ const xx=bx+i*62; ctx.fillStyle=line; ctx.fillRect(xx,by,bw,bh); ctx.fillStyle=col; const hh=Math.min(1,val/Etot)*bh; ctx.fillRect(xx,by+bh-hh,bw,hh); ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(lab, xx+bw/2, by+bh+16); if ($('nums').checked){ ctx.fillStyle=muted; ctx.font='11px IBM Plex Mono, monospace'; ctx.fillText((val/1000).toFixed(1)+' kJ', xx+bw/2, by+bh+32);} };
    bar(0,Ep,acc,'Ep'); bar(1,Ek,hot,'Ek'); bar(2,lost,muted,'thermal'); bar(3,Etot,good,'total');
    ctx.fillStyle=fg; ctx.textAlign='left'; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.fillText('Energy stores', bx, by-16); }
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText(+$('fric').value===0 ? 'No friction: Ep + Ek stays constant. The car can only reach the start height, never higher.' : 'Friction: some energy is transferred to the thermal store of the track and air each metre. The car climbs less each time.', 40, 420);
  ctx.fillText(`m = ${m} kg, g = 10 N/kg.  Ep = mgh = ${m} × 10 × ${h.toFixed(1)} = ${(Ep/1000).toFixed(1)} kJ.  Ek = ½mv² = ½ × ${m} × ${v.toFixed(1)}² = ${(Ek/1000).toFixed(1)} kJ.`, 40, 444);
  $('rH').textContent=h.toFixed(1)+' m'; $('rV').textContent=v.toFixed(1)+' m/s'; $('rEp').textContent=$('nums').checked?(Ep/1000).toFixed(1)+' kJ':'?'; $('rEk').textContent=$('nums').checked?(Ek/1000).toFixed(1)+' kJ':'?';
}
function drawCrane(){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),hot=css('--hot'),good=css('--good');
  const m=+$('cm').value, hh=+$('ch').value, T=+$('ct').value; const F=m*g, Wd=F*hh, P=Wd/T;
  const f=Math.min(1, ct/T); const y=hh*f;
  ctx.clearRect(0,0,W,H);
  const py=Y=>400-Y/22*320;
  // crane
  ctx.strokeStyle=fg; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(120,400); ctx.lineTo(120,50); ctx.lineTo(420,50); ctx.stroke(); ctx.lineWidth=1;
  ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(40,400); ctx.lineTo(620,400); ctx.stroke();
  // rope and crate
  const cx=380; ctx.strokeStyle=muted; ctx.beginPath(); ctx.moveTo(cx,50); ctx.lineTo(cx,py(y)-40); ctx.stroke();
  const s=40+m/1000*40; ctx.fillStyle=css('--warn'); ctx.fillRect(cx-s/2, py(y)-s, s, s); ctx.fillStyle=fg; ctx.textAlign='center'; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.fillText(m+' kg', cx, py(y)-s/2+4);
  // force arrows
  ctx.strokeStyle=good; ctx.fillStyle=good; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx+s/2+16,py(y)); ctx.lineTo(cx+s/2+16,py(y)-s-30); ctx.stroke(); ctx.lineWidth=1; ctx.textAlign='left'; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('pull '+F+' N', cx+s/2+24, py(y)-s-20);
  ctx.strokeStyle=hot; ctx.fillStyle=hot; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-s/2-16,py(y)-s); ctx.lineTo(cx-s/2-16,py(y)+30); ctx.stroke(); ctx.lineWidth=1; ctx.textAlign='right'; ctx.fillText('weight '+F+' N', cx-s/2-24, py(y)+30);
  // height axis
  ctx.fillStyle=muted; ctx.textAlign='right'; ctx.font='11px IBM Plex Mono, monospace'; for (const Y of [0,5,10,15,20]) ctx.fillText(Y+' m', 100, py(Y)+4);
  ctx.strokeStyle=acc; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(140,py(hh)); ctx.lineTo(600,py(hh)); ctx.stroke(); ctx.setLineDash([]);
  // text
  const rx=640; ctx.fillStyle=fg; ctx.textAlign='left'; ctx.font='600 14px IBM Plex Sans, sans-serif'; ctx.fillText('Lifting at steady speed', rx, 70);
  ctx.font='13px IBM Plex Sans, sans-serif';
  [`force needed = weight = ${m} × 10 = ${F} N`, `distance moved = ${hh} m`, `work done = F × d = ${F} × ${hh} = ${Wd} J`, `= Ep gained = mgh = ${Wd} J`, `time = ${T} s`, `power = work ÷ time = ${Wd} ÷ ${T} = ${+(P.toFixed(0))} W`].forEach((s,i)=>ctx.fillText(s, rx, 100+i*26));
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('Faster lift (smaller time): same work, more power.', rx, 280); ctx.fillText('Heavier crate: more force, more work, more power.', rx, 300);
  // progress
  ctx.fillStyle=line; ctx.fillRect(rx, 330, 220, 14); ctx.fillStyle=acc; ctx.fillRect(rx,330,220*f,14); ctx.fillStyle=muted; ctx.font='11px IBM Plex Mono, monospace'; ctx.fillText(`t = ${Math.min(T,ct).toFixed(1)} s`, rx, 362);
  $('cmV').textContent=m+' kg'; $('chV').textContent=hh+' m'; $('ctV').textContent=T+' s'; $('rF').textContent=F+' N'; $('rWd').textContent=Wd+' J'; $('rPw').textContent=(+P.toFixed(0))+' W'; $('rEpg').textContent=Wd+' J';
}
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (running){ if (mode==='coaster') stepCoaster(dt); else { ct+=dt; if (ct>+$('ct').value+1.5) ct=0; } } if (mode==='coaster') drawCoaster(); else drawCrane(); requestAnimationFrame(frame); }
function notice(){ $('notice').innerHTML = mode==='coaster'
  ? '<b>What to notice.</b> Energy is transferred mechanically between the gravitational potential store (height) and the kinetic store (speed). Without friction the total stays the same, so the car reaches exactly the start height on the far side. With friction the thermal store grows and the car cannot climb as high.'
  : '<b>What to notice.</b> Work done = force × distance moved in the direction of the force. Lifting at steady speed, the force equals the weight, so work done = mgh, the gain in gravitational potential energy. Power is how fast that work is done.'; }
$('modeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.v; [...$('modeSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); $('coCtl').classList.toggle('hide',mode!=='coaster'); $('crCtl').classList.toggle('hide',mode!=='crane'); $('crCtl').style.display=mode==='crane'?'flex':''; reset(); notice(); });
$('h0').addEventListener('input',()=>{ $('h0V').textContent=$('h0').value+' m'; reset(); });
$('mass').addEventListener('input',()=>{ $('massV').textContent=$('mass').value+' kg'; });
$('fric').addEventListener('input',()=>{ const f=+$('fric').value; $('fricV').textContent=f===0?'none':f<4?'low':f<8?'medium':'high'; });
$('play').addEventListener('click',()=>{ running=!running; $('play').textContent=running?'Pause':'Play'; });
$('reset').addEventListener('click',reset);
notice(); requestAnimationFrame(frame);
})();
</script>
