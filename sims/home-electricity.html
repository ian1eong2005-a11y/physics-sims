<title>Home Electricity</title>
<meta charset="utf-8">

<header>
  <h1>Home Electricity</h1>
  <span class="lo">5086 · 14a–14i · P = VI, E = VIt, kWh cost, fuses, earthing, the mains plug</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="500" aria-label="Appliance with meter, or a mains plug and safety scenario"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button data-v="app" aria-pressed="true">Appliances &amp; cost</button>
        <button data-v="safe" aria-pressed="false">Plug &amp; safety</button>
      </div>
    </div>

    <div id="aCtl" style="display:flex;flex-direction:column;gap:14px">
      <div class="ctl">
        <label for="app">Appliance (mains 230 V)</label>
        <select id="app">
          <option value="2000">Kettle · 2000 W</option>
          <option value="2500">Oven · 2500 W</option>
          <option value="1500">Heater · 1500 W</option>
          <option value="1200">Hair dryer · 1200 W</option>
          <option value="900">Air-conditioner · 900 W</option>
          <option value="100">Television · 100 W</option>
          <option value="60">Fan · 60 W</option>
          <option value="10">LED lamp · 10 W</option>
        </select>
      </div>
      <div class="ctl">
        <div class="row"><label for="hrs">Hours used per day</label><span class="val" id="hrsV">2 h</span></div>
        <input type="range" id="hrs" min="0.25" max="24" step="0.25" value="2">
      </div>
      <div class="ctl">
        <div class="row"><label for="tariff">Price per kWh</label><span class="val" id="tariffV">30 ¢</span></div>
        <input type="range" id="tariff" min="20" max="40" step="1" value="30">
      </div>
      <div class="ctl">
        <span class="lbl">Fuse in the plug</span>
        <div class="seg three" id="fuse">
          <button data-v="3" aria-pressed="false">3 A</button><button data-v="5" aria-pressed="false">5 A</button><button data-v="13" aria-pressed="true">13 A</button>
        </div>
      </div>
      <div class="read">
        <div><small>Current I = P ÷ V</small><span id="rI">–</span></div>
        <div><small>Energy per day</small><span id="rE">–</span></div>
        <div><small>Cost per day</small><span id="rC">–</span></div>
        <div><small>Cost per 30 days</small><span id="rC30">–</span></div>
      </div>
    </div>

    <div id="sCtl" class="hide" style="flex-direction:column;gap:14px">
      <div class="ctl">
        <span class="lbl">Scenario</span>
        <div class="list" id="scen">
          <button data-v="plug" aria-pressed="true">Wiring a 3-pin plug</button>
          <button data-v="fault" aria-pressed="false">Live wire touches the metal case</button>
          <button data-v="switch" aria-pressed="false">Switch on live or neutral?</button>
        </div>
      </div>
      <div id="faultCtl" class="ctl hide">
        <label class="check"><input type="checkbox" id="earthed" checked> Metal case connected to earth</label>
        <label class="check"><input type="checkbox" id="fuseIn" checked> Fuse fitted in the live wire</label>
      </div>
      <div id="swCtl" class="ctl hide">
        <span class="lbl">Switch is in the</span>
        <div class="seg" id="swWire"><button data-v="L" aria-pressed="true">live wire</button><button data-v="N" aria-pressed="false">neutral wire</button></div>
        <label class="check"><input type="checkbox" id="swOpen" checked> Switch is OFF (open)</label>
      </div>
      <div class="fb" id="fb"></div>
    </div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode='app', fuse=13, scen='plug', swWire='L', t=0, last=performance.now(), spin=0;
const V=230;
const BROWN='#8a5a2b', BLUE='#2a7de1', GY='#2e9e5b';

function drawApp(dt){
  const W=cv.width,H=cv.height, fg=css('--fg'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),hot=css('--hot'),good=css('--good');
  const P=+$('app').value, h=+$('hrs').value, c=+$('tariff').value; const I=P/V, kwh=P/1000*h, cost=kwh*c;
  spin+=dt*P/400;
  ctx.clearRect(0,0,W,H);
  // appliance box
  ctx.fillStyle=css('--panel'); ctx.strokeStyle=line; ctx.fillRect(60,80,260,180); ctx.strokeRect(60,80,260,180);
  ctx.fillStyle=fg; ctx.font='600 16px Bricolage Grotesque, sans-serif'; ctx.textAlign='center'; ctx.fillText($('app').selectedOptions[0].text, 190, 115);
  ctx.font='13px IBM Plex Sans, sans-serif'; ctx.fillStyle=muted; ctx.fillText('rated 230 V, '+P+' W', 190, 140);
  // heat glow for heating appliances
  if (P>=900){ ctx.fillStyle=hot; ctx.globalAlpha=.25+.15*Math.sin(t*3); ctx.fillRect(90,160,200,70); ctx.globalAlpha=1; ctx.fillStyle=fg; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('heating effect of the current', 190, 200); }
  else { ctx.fillStyle=fg; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('low power: small current, little heating', 190, 200); }
  // meter disc
  ctx.fillStyle=css('--panel'); ctx.beginPath(); ctx.arc(460,170,70,0,7); ctx.fill(); ctx.strokeStyle=line; ctx.stroke();
  ctx.save(); ctx.translate(460,170); ctx.rotate(spin); ctx.strokeStyle=acc; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-60); ctx.stroke(); ctx.restore(); ctx.lineWidth=1;
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('electricity meter', 460, 262); ctx.fillText('spins faster for higher power', 460, 280);
  // fuse status
  const ok=I<=fuse, tooBig=fuse>2.5*I+1;
  ctx.fillStyle=ok?(tooBig?css('--warn'):good):hot; ctx.fillRect(580,100,280,60);
  ctx.fillStyle='#fff'; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText(ok? (tooBig? `${fuse} A fuse works, but is far above ${I.toFixed(1)} A` : `${fuse} A fuse: good (just above ${I.toFixed(1)} A)`) : `${fuse} A fuse BLOWS: current ${I.toFixed(1)} A is too big`, 592, 125);
  ctx.fillText(ok? (tooBig? 'a fault current might not blow it in time' : 'blows if the current rises above it') : 'choose a rating just above the normal current', 592, 146);
  // working
  ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif';
  [`current I = P ÷ V = ${P} ÷ 230 = ${I.toFixed(2)} A`, `energy = P × t = ${P/1000} kW × ${h} h = ${kwh.toFixed(2)} kWh per day`, `(in joules: E = VIt = 230 × ${I.toFixed(2)} × ${(h*3600).toFixed(0)} s = ${(P*h*3600/1e6).toFixed(2)} MJ)`, `cost = ${kwh.toFixed(2)} kWh × ${c} ¢ = ${cost<100? cost.toFixed(1)+' ¢' : '$'+(cost/100).toFixed(2)} per day`, `over 30 days: $${(cost*30/100).toFixed(2)}`].forEach((s,i)=>ctx.fillText(s, 60, 320+i*26));
  $('hrsV').textContent=h+' h'; $('tariffV').textContent=c+' ¢'; $('rI').textContent=I.toFixed(2)+' A'; $('rE').textContent=kwh.toFixed(2)+' kWh'; $('rC').textContent= cost<100? cost.toFixed(1)+' ¢' : '$'+(cost/100).toFixed(2); $('rC30').textContent='$'+(cost*30/100).toFixed(2);
}

function wire(x1,y1,x2,y2,col,w=4){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.lineWidth=1; }
function drawPlug(){
  const W=cv.width, fg=css('--fg'),muted=css('--muted'),line=css('--line');
  // plug body
  ctx.fillStyle=css('--panel'); ctx.strokeStyle=line; ctx.beginPath(); ctx.roundRect(250,80,400,300,24); ctx.fill(); ctx.stroke();
  // pins (viewed from inside the plug: earth top, live bottom right (brown), neutral bottom left (blue))
  ctx.fillStyle=fg; ctx.fillRect(438,30,24,70); ctx.fillRect(300,300,22,60); ctx.fillRect(580,300,22,60);
  ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillStyle=fg;
  ctx.fillText('EARTH pin (longest)', 450, 20);
  // cable entry at bottom centre
  ctx.fillStyle=muted; ctx.fillRect(430,380,40,60); ctx.fillStyle=fg; ctx.fillText('cable', 450, 460);
  // wires
  wire(450,380,450,110,GY,6); ctx.fillStyle=GY; ctx.fillText('green/yellow = EARTH', 450, 150);
  wire(440,380,311,300,BLUE,6); ctx.fillStyle=BLUE; ctx.fillText('blue = NEUTRAL', 311, 285);
  wire(460,380,560,230,BROWN,6); wire(560,230,591,300,BROWN,6); ctx.fillStyle=BROWN; ctx.fillText('brown = LIVE', 600, 215);
  // fuse in the live wire
  ctx.fillStyle=css('--warn'); ctx.fillRect(545,235,30,60); ctx.fillStyle=fg; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText('fuse', 560, 310);
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ['LIVE (brown): carries the 230 V supply; the fuse and switch sit in this wire.', 'NEUTRAL (blue): completes the circuit, close to 0 V.', 'EARTH (green/yellow): safety wire joined to the metal case; normally carries no current.', 'Memory aid: BRown goes Bottom Right; BLue goes Bottom Left.'].forEach((s,i)=>ctx.fillText(s, 30, 410+i*20));
  $('fb').className='fb'; $('fb').textContent='Earth pin at the top, live (brown, with fuse) bottom right, neutral (blue) bottom left.';
}
function drawFault(){
  const fg=css('--fg'),muted=css('--muted'),line=css('--line'),hot=css('--hot'),good=css('--good');
  const earthed=$('earthed').checked, fuseIn=$('fuseIn').checked;
  // supply on the left
  ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('mains supply', 40, 60);
  wire(60,100,300,100,BROWN,5); ctx.fillStyle=BROWN; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('live 230 V', 60, 90);
  wire(60,300,300,300,BLUE,5); ctx.fillStyle=BLUE; ctx.fillText('neutral', 60, 320);
  // fuse
  if (fuseIn){ ctx.fillStyle=css('--warn'); ctx.fillRect(150,88,40,24); ctx.fillStyle=fg; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText('fuse', 158,80); }
  // appliance metal case
  ctx.strokeStyle=line; ctx.lineWidth=6; ctx.strokeRect(300,60,320,280); ctx.lineWidth=1; ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText('metal case', 310, 80);
  // heating element inside
  ctx.strokeStyle=hot; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(300,100); ctx.lineTo(380,100); for(let i=0;i<8;i++){ ctx.lineTo(380+i*20+10, i%2?100:160);} ctx.lineTo(560,160); ctx.lineTo(560,300); ctx.lineTo(300,300); ctx.stroke(); ctx.lineWidth=1;
  // the fault: live wire frayed and touching the case
  ctx.strokeStyle=BROWN; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(340,100); ctx.lineTo(330,66); ctx.stroke(); ctx.lineWidth=1; ctx.fillStyle=hot; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.fillText('⚡ damaged insulation: live touches case', 350, 50);
  // earth wire
  if (earthed){ wire(620,330,760,330,GY,5); wire(760,330,760,420,GY,5); ctx.strokeStyle=GY; for(let i=0;i<3;i++){ ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(760-20+i*8,420+i*10); ctx.lineTo(760+20-i*8,420+i*10); ctx.stroke(); } ctx.lineWidth=1; ctx.fillStyle=GY; ctx.fillText('earth wire → ground', 640, 320); }
  // person touching
  ctx.fillStyle=fg; ctx.font='28px system-ui, sans-serif'; ctx.fillText('🧍', 640, 230); ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillStyle=muted; ctx.fillText('person touching the case', 600, 262);
  let msg, cls;
  if (earthed && fuseIn){ msg='Large current flows from the live wire through the case to earth. The fuse melts and cuts off the live wire. The case is safe.'; cls='ok'; ctx.fillStyle=good; }
  else if (earthed && !fuseIn){ msg='Current flows to earth through the case, but with no fuse nothing cuts the supply. The cable overheats and could start a fire.'; cls='bad'; ctx.fillStyle=hot; }
  else { msg='No earth path: the case stays at 230 V. Nothing blows. A person touching it becomes the path to earth and gets an electric shock.'; cls='bad'; ctx.fillStyle=hot; }
  ctx.font='600 14px IBM Plex Sans, sans-serif'; ctx.fillText(cls==='ok'?'SAFE: fuse blows, supply cut off':'DANGER', 40, 400);
  ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif'; wrap(msg, 40, 424, 820, 20);
  $('fb').className='fb '+cls; $('fb').textContent=msg;
}
function drawSwitch(){
  const fg=css('--fg'),muted=css('--muted'),line=css('--line'),hot=css('--hot'),good=css('--good');
  const open=$('swOpen').checked, onLive=swWire==='L';
  ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('mains supply', 40, 60);
  // live wire top, neutral bottom, lamp on the right
  const liveToLamp = onLive ? !open : true; // is the lamp side of the live wire connected to 230 V?
  const lampOn=!open;
  // live
  wire(60,100,onLive?250:600,100,BROWN,5); if (onLive){ drawSw(250,100,open); wire(open?330:320,100,600,100, liveToLamp?BROWN:line,5); }
  wire(600,100,600,180,liveToLamp?BROWN:line,5);
  // lamp
  ctx.fillStyle=lampOn?css('--warn'):css('--panel'); ctx.strokeStyle=fg; ctx.beginPath(); ctx.arc(600,230,44,0,7); ctx.fill(); ctx.stroke(); ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(lampOn?'ON':'OFF', 600, 235);
  wire(600,274,600,300,BLUE,5);
  if (!onLive){ wire(600,300,330,300,BLUE,5); drawSw(250,300,open); wire(60,300,250,300,BLUE,5); } else wire(600,300,60,300,BLUE,5);
  ctx.fillStyle=BROWN; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('live 230 V', 60, 90); ctx.fillStyle=BLUE; ctx.fillText('neutral 0 V', 60, 320);
  // voltage label on the lamp side of the live wire
  ctx.fillStyle=liveToLamp?hot:good; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.fillText(liveToLamp?'lamp terminals at 230 V':'lamp terminals at 0 V', 640, 120);
  let msg, cls;
  if (!open) { msg='Switch closed: the lamp is on either way. The difference only shows when you switch OFF.'; cls=''; }
  else if (onLive) { msg='Switch in the LIVE wire and off: the lamp and its wiring are disconnected from 230 V. Safe to change the bulb.'; cls='ok'; }
  else { msg='Switch in the NEUTRAL wire and off: the lamp is dark, but it is still joined to the 230 V live wire. Touching the lamp socket could give a shock.'; cls='bad'; }
  ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif'; wrap(msg, 40, 400, 820, 20);
  ctx.fillStyle=muted; ctx.fillText('The same reasoning applies to fuses and circuit breakers: they must be in the live wire so that when they operate, the appliance is disconnected from the high voltage.', 40, 450);
  $('fb').className='fb '+cls; $('fb').textContent=msg;
}
function drawSw(x,y,open){ ctx.fillStyle=css('--fg'); ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(x+70,y,4,0,7); ctx.fill(); ctx.strokeStyle=css('--fg'); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(open?x+62:x+70, open?y-28:y); ctx.stroke(); ctx.lineWidth=1; ctx.fillStyle=css('--muted'); ctx.font='11px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('switch', x+35, y+24); }
function wrap(text,x,y,w,lh){ const words=text.split(' '); let line='', yy=y; for (const wd of words){ const test=line+wd+' '; if (ctx.measureText(test).width>w){ ctx.fillText(line,x,yy); line=wd+' '; yy+=lh; } else line=test; } ctx.fillText(line,x,yy); }
function drawSafe(){ ctx.clearRect(0,0,cv.width,cv.height); if (scen==='plug') drawPlug(); else if (scen==='fault') drawFault(); else drawSwitch(); }
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt; if (mode==='app') drawApp(dt); else drawSafe(); requestAnimationFrame(frame); }
function notice(){ $('notice').innerHTML = mode==='app'
  ? '<b>What to notice.</b> Heating appliances have high power, so they draw a large current (I = P/V) and need a higher fuse rating. Energy in kilowatt-hours is power in kW × time in hours; the bill is kWh × price per kWh.'
  : '<b>What to notice.</b> The earth wire gives a fault current an easy path so that the fuse blows and the live supply is cut off. The fuse and switch go in the live wire so that when they open, the appliance is no longer connected to 230 V.'; }
const seg=(id,fn)=>$(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b)); fn(b.dataset.v); });
seg('modeSeg',v=>{ mode=v; $('aCtl').classList.toggle('hide',mode!=='app'); $('sCtl').classList.toggle('hide',mode!=='safe'); $('sCtl').style.display=mode==='safe'?'flex':''; notice(); });
seg('fuse',v=>fuse=+v); seg('swWire',v=>swWire=v);
seg('scen',v=>{ scen=v; $('faultCtl').classList.toggle('hide',scen!=='fault'); $('swCtl').classList.toggle('hide',scen!=='switch'); });
notice(); requestAnimationFrame(frame);
})();
</script>
