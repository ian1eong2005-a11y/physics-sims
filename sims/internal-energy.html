<title>Heating Curve Lab</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --hot:#e4572e; --ke:#e4572e; --pe:#2a7de1; --solid:#5b6675; --liquid:#2a7de1; --gas:#2e9e5b;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--ke:#ff7a50;--pe:#5aa6ff;--solid:#98a4b3;--liquid:#5aa6ff;--gas:#4cc078;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--ke:#ff7a50;--pe:#5aa6ff;--solid:#98a4b3;--liquid:#5aa6ff;--gas:#4cc078;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.buttons{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.read div{background:var(--bg);border-radius:8px;padding:8px 4px}
.read span{display:block;font-family:var(--mono);font-size:1rem;font-variant-numeric:tabular-nums}
.read small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
</style>

<header>
  <h1>Heating Curve Lab</h1>
  <span class="lo">5086 · 7b–7e · temperature, kinetic energy, potential energy and changes of state</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="520" aria-label="Particles being heated with energy bars and a heating curve"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Heater</span>
      <div class="seg" id="dirSeg">
        <button data-v="heat" aria-pressed="true">Heating</button>
        <button data-v="cool" aria-pressed="false">Cooling</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="power">Heater power</label><span class="val" id="powerV">60%</span></div>
      <input type="range" id="power" min="10" max="100" value="60">
    </div>
    <div class="ctl">
      <label for="sub">Substance</label>
      <select id="sub">
        <option value="water">Water (melts 0 °C, boils 100 °C)</option>
        <option value="wax">Wax (melts 60 °C, boils 350 °C)</option>
      </select>
    </div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="bars" checked> Show KE and PE bars</label>
      <label class="check"><input type="checkbox" id="graph" checked> Show temperature–time graph</label>
    </div>
    <div class="read">
      <div><small>Temperature</small><span id="rT">–</span></div>
      <div><small>State</small><span id="rS">–</span></div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="play">Pause</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SUBS={ water:{Tm:0, Tb:100, T0:-40, Tmax:140}, wax:{Tm:60, Tb:350, T0:20, Tmax:420} };
// Energy model: E is the energy supplied (arbitrary units). Each stage uses a fixed amount.
// heat solid 0-1, melt 1-2, heat liquid 2-3.4, boil 3.4-5.4, heat gas 5.4-6.
const STAGES=[[0,1],[1,2],[2,3.4],[3.4,5.4],[5.4,6]];
let E=0, t=0, running=true, dir=1, hist=[], P=[];
const N=64;
const S=()=>({power:+$('power').value/100, sub:SUBS[$('sub').value]});

function stage(){ for (let i=0;i<5;i++) if (E<STAGES[i][1]) return i; return 4; }
function temperature(){ const s=S().sub, k=stage(), [a,b]=STAGES[k], f=(E-a)/(b-a);
  if (k===0) return s.T0+(s.Tm-s.T0)*f; if (k===1) return s.Tm; if (k===2) return s.Tm+(s.Tb-s.Tm)*f; if (k===3) return s.Tb; return s.Tb+(s.Tmax-s.Tb)*Math.min(1,f); }
function peLevel(){ const k=stage(); if (k===0) return 0; if (k===1) return (E-1)/1; if (k===2) return 1; if (k===3) return 1+(E-3.4)/2; return 2; }
function keLevel(){ const s=S().sub; return (temperature()-s.T0)/(s.Tmax-s.T0); }

function reset(){ E=0; t=0; hist=[]; P=[]; const cols=8; for (let i=0;i<N;i++) P.push({c:i%cols, r:(i/cols)|0, x:0,y:0, vx:0,vy:0, phase:Math.random()*7}); }
function step(dt){ const s=S(); E += dir*s.power*0.12*dt; E=Math.max(0,Math.min(6,E)); t+=dt; hist.push([t,temperature()]); if (hist.length>1500) hist.shift(); }

function draw(){
  const W=cv.width,H=cv.height,s=S(), fg=css('--fg'),muted=css('--muted'),line=css('--line'),ke=css('--ke'),pe=css('--pe'),hot=css('--hot');
  ctx.clearRect(0,0,W,H);
  const k=stage(), T=temperature(), frac=(E-STAGES[k][0])/(STAGES[k][1]-STAGES[k][0]);
  // box of particles
  const bx=40, by=40, bw=300, bh=300;
  ctx.strokeStyle=line; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh); ctx.lineWidth=1;
  // heater under the box
  ctx.fillStyle=dir>0?hot:css('--pe'); ctx.globalAlpha=.3+.6*s.power; ctx.fillRect(bx,by+bh+6,bw,10); ctx.globalAlpha=1; ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(dir>0?'heater on':'cooling', bx+bw/2, by+bh+32);
  // which particles are free: melted fraction / boiled fraction
  const melted = k===0?0:k===1?frac:1, boiled = k<3?0:k===3?frac:1;
  const jit = 0.5+2.5*Math.max(0,keLevel());
  const sp=bw/8;
  P.forEach((p,i)=>{
    const isGas = i < boiled*N, isLiq = !isGas && i < melted*N;
    let x,y;
    if (isGas){ if (p.vx===0&&p.vy===0){ p.x=bx+Math.random()*bw; p.y=by+Math.random()*bh; p.vx=(Math.random()-0.5)*160; p.vy=(Math.random()-0.5)*160; }
      const spd=0.6+keLevel(); p.x+=p.vx*spd*0.016; p.y+=p.vy*spd*0.016; if(p.x<bx+6||p.x>bx+bw-6) p.vx*=-1; if(p.y<by+6||p.y>by+bh-6) p.vy*=-1; p.x=Math.min(bx+bw-6,Math.max(bx+6,p.x)); p.y=Math.min(by+bh-6,Math.max(by+6,p.y)); x=p.x; y=p.y; }
    else if (isLiq){ // liquid: close together in the lower part, slowly drifting past each other
      const row=(i/8)|0, col=i%8; const drift=Math.sin(t*0.8+p.phase)*10, bob=Math.cos(t*1.1+p.phase)*4;
      x=bx+sp*(col+0.5)+drift + jit*Math.sin(t*9+p.phase); y=by+bh-sp*(row+0.6)+bob + jit*Math.cos(t*8+p.phase); p.vx=p.vy=0; }
    else { // solid lattice, vibrating about fixed positions
      x=bx+sp*(p.c+0.5)+jit*Math.sin(t*10+p.phase); y=by+bh-sp*(p.r+0.6)+jit*Math.cos(t*9+p.phase*1.3); p.vx=p.vy=0; }
    ctx.fillStyle=isGas?css('--gas'):isLiq?css('--liquid'):css('--solid'); ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
  });
  const state = k===0?'solid':k===1?'melting (solid + liquid)':k===2?'liquid':k===3?'boiling (liquid + gas)':'gas';
  ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText(state, bx, by-12);
  // energy bars
  if ($('bars').checked){ const ex=380, ey=60, ewidth=60, eh=260;
    const bar=(x,v,col,label,sub)=>{ ctx.fillStyle=line; ctx.fillRect(x,ey,ewidth,eh); ctx.fillStyle=col; const h=Math.min(1,v/2)*eh; ctx.fillRect(x,ey+eh-h,ewidth,h); ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(label,x+ewidth/2,ey+eh+18); ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText(sub,x+ewidth/2,ey+eh+34); };
    bar(ex, keLevel()*2, ke, 'KE', 'average kinetic energy'); bar(ex+90, peLevel(), pe, 'PE', 'potential energy'); bar(ex+180, keLevel()+peLevel()/2*1, fg, 'internal', 'KE + PE total');
    ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('Energy of the particles', ex, ey-14);
    const msg = (k===1||k===3) ? 'Plateau: energy goes into PE (separating the particles), KE and temperature stay the same' : 'Energy goes into KE: particles move faster, temperature rises';
    ctx.fillStyle=(k===1||k===3)?pe:ke; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillText(msg, ex, ey+eh+58); }
  // heating curve
  if ($('graph').checked){ const gx=680, gy=60, gw=190, gh=260, tmax=Math.max(60,t);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx,gy+gh); ctx.lineTo(gx+gw,gy+gh); ctx.stroke();
    const ty=T=>gy+gh-(T-s.sub.T0)/(s.sub.Tmax-s.sub.T0)*gh;
    ctx.fillStyle=muted; ctx.font='11px IBM Plex Mono, monospace'; ctx.textAlign='right';
    for (const Tt of [s.sub.T0,s.sub.Tm,s.sub.Tb,s.sub.Tmax]){ ctx.fillText(Tt, gx-4, ty(Tt)+4); ctx.globalAlpha=.4; ctx.beginPath(); ctx.moveTo(gx,ty(Tt)); ctx.lineTo(gx+gw,ty(Tt)); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.textAlign='center'; ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.fillText('temperature–time', gx+gw/2, gy-14); ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.fillText('time →', gx+gw/2, gy+gh+16);
    ctx.save(); ctx.translate(gx-34,gy+gh/2); ctx.rotate(-Math.PI/2); ctx.fillText('°C',0,0); ctx.restore();
    ctx.strokeStyle=hot; ctx.lineWidth=2.5; ctx.beginPath(); hist.forEach(([tt,TT],i)=>{ const x=gx+tt/tmax*gw, y=ty(TT); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.lineWidth=1;
    ctx.fillStyle=muted; ctx.font='10px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText('melting', gx+4, ty(s.sub.Tm)-4); ctx.fillText('boiling', gx+4, ty(s.sub.Tb)-4); }
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText('Grey = solid (fixed positions, vibrating).  Blue = liquid (close, sliding past each other).  Green = gas (far apart, fast, random).', 40, H-40);
  ctx.fillText(`energy supplied so far: ${(E*10).toFixed(0)} units`, 40, H-20);
  $('rT').textContent=T.toFixed(0)+' °C'; $('rS').textContent=state.split(' ')[0];
}
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (running) step(dt); draw(); requestAnimationFrame(frame); }
function notice(){ $('notice').innerHTML='<b>What to notice.</b> While the temperature is rising, the energy supplied makes the particles move faster: their average <b>kinetic energy</b> rises. At the melting point and the boiling point the temperature stops rising even though the heater is still on. That energy is used to pull the particles apart against the forces between them: their <b>potential energy</b> rises instead. Internal energy (KE + PE) always rises while heating.'; }
$('dirSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; dir=b.dataset.v==='heat'?1:-1; [...$('dirSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); });
$('power').addEventListener('input',()=>$('powerV').textContent=$('power').value+'%');
$('sub').addEventListener('change',reset);
$('play').addEventListener('click',()=>{ running=!running; $('play').textContent=running?'Pause':'Play'; });
$('reset').addEventListener('click',reset);
reset(); notice(); requestAnimationFrame(frame);
})();
</script>
