<title>Conduction Lab</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: lab bench. Wide canvas stage on the left, instrument panel on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --hot:#e4572e; --cold:#2a7de1; --ok:#2e9e5b; --electron:#d9a400;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--cold:#5aa6ff;--ok:#4cc078;--electron:#ffd24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--cold:#5aa6ff;--ok:#4cc078;--electron:#ffd24a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.buttons{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.therm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.therm div{background:var(--bg);border-radius:8px;padding:8px 4px}
.therm span{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.therm small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
</style>

<header>
  <h1>Conduction Lab</h1>
  <span class="lo">5086 · 8a, 8b · heating a solid rod</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="520" aria-label="Rod of particles being heated"></canvas>
    <p class="notice" id="notice"></p>
  </div>

  <div class="panel">
    <div class="ctl">
      <span class="lbl">Heater at</span>
      <div class="seg" id="heaterSeg">
        <button data-v="left" aria-pressed="true">Left</button>
        <button data-v="right" aria-pressed="false">Right</button>
        <button data-v="both" aria-pressed="false">Both</button>
        <button data-v="off" aria-pressed="false">Off</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="power">Heater power</label><span class="val" id="powerV">60%</span></div>
      <input type="range" id="power" min="0" max="100" value="60">
    </div>
    <div class="ctl">
      <label for="material">Material of rod</label>
      <select id="material">
        <option value="copper">Copper (metal)</option>
        <option value="iron">Iron (metal)</option>
        <option value="glass">Glass (non-metal)</option>
        <option value="wood">Wood (non-metal)</option>
      </select>
    </div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="ice"> Ice on the other end</label>
      <label class="check"><input type="checkbox" id="electrons" checked> Show free electrons</label>
      <label class="check"><input type="checkbox" id="collide" checked> Flash when neighbours collide</label>
    </div>
    <div class="ctl">
      <div class="row"><label for="speed">Simulation speed</label><span class="val" id="speedV">1.5×</span></div>
      <input type="range" id="speed" min="0.5" max="4" step="0.1" value="1.5">
    </div>
    <div class="therm">
      <div><small>Left end</small><span id="tL">25 °C</span></div>
      <div><small>Middle</small><span id="tM">25 °C</span></div>
      <div><small>Right end</small><span id="tR">25 °C</span></div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="play">Pause</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Materials: lattice = how fast vibrations pass between neighbours; electrons = free electrons carrying energy
const MATERIALS = {
  copper:{lattice:5.0, electrons:80, eSpeed:3.5, label:'Copper conducts fastest: free electrons race through the metal carrying energy, as well as the atoms passing on vibrations.'},
  iron:  {lattice:3.0, electrons:40, eSpeed:2.0, label:'Iron is a metal too, so it has free electrons, but fewer move freely and the energy spreads more slowly than in copper.'},
  glass: {lattice:1.3, electrons:0, eSpeed:0, label:'Glass has no free electrons. Energy passes only by atoms vibrating more and knocking their neighbours, so it spreads slowly.'},
  wood:  {lattice:0.35, electrons:0, eSpeed:0, label:'Wood is an insulator: its particles are loosely linked, so vibrations barely pass along. The far end stays cool for a long time.'}
};
const COLS = 30, ROWS = 5;
let T, electrons, t = 0, running = true, heater = 'left';
const state = () => ({power: +$('power').value/100, mat: MATERIALS[$('material').value], ice: $('ice').checked, speed: +$('speed').value});

function reset(){
  T = new Float32Array(COLS*ROWS);
  const m = MATERIALS[$('material').value];
  electrons = Array.from({length:m.electrons}, () => ({x:Math.random()*COLS, y:Math.random()*ROWS, a:Math.random()*Math.PI*2, E:0}));
  t = 0;
}
const idx = (c,r) => r*COLS + c;

function step(dt){
  const s = state();
  // heater and ice at the ends
  for (let r=0;r<ROWS;r++){
    if (heater==='left'||heater==='both') T[idx(0,r)] += s.power*5*dt*(1-T[idx(0,r)]);
    if (heater==='right'||heater==='both') T[idx(COLS-1,r)] += s.power*5*dt*(1-T[idx(COLS-1,r)]);
    if (s.ice){
      if (heater!=='right') T[idx(COLS-1,r)] -= 4*dt*T[idx(COLS-1,r)];
      if (heater!=='left') T[idx(0,r)] -= 4*dt*T[idx(0,r)];
    }
  }
  // lattice conduction: each particle shares energy with its neighbours
  const Tn = new Float32Array(T.length), k = s.mat.lattice*dt;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    let sum=0,n=0;
    if(c>0){sum+=T[idx(c-1,r)];n++} if(c<COLS-1){sum+=T[idx(c+1,r)];n++}
    if(r>0){sum+=T[idx(c,r-1)];n++} if(r<ROWS-1){sum+=T[idx(c,r+1)];n++}
    const i=idx(c,r);
    Tn[i] = T[i] + k*(sum - n*T[i]) - 0.02*dt*T[i]; // last term: slow loss to the room
  }
  T = Tn;
  // free electrons: wander fast, pick up energy where it is hot, drop it where it is cold
  for (const e of electrons){
    const c = Math.min(COLS-1, Math.max(0, e.x|0)), r = Math.min(ROWS-1, Math.max(0, e.y|0)), i = idx(c,r);
    const sp = s.mat.eSpeed*(6+10*T[i])*dt;
    e.a += (Math.random()-0.5)*1.4;
    e.x += Math.cos(e.a)*sp; e.y += Math.sin(e.a)*sp*0.6;
    if (e.x<0){e.x=0;e.a=Math.PI-e.a} if (e.x>COLS-0.01){e.x=COLS-0.01;e.a=Math.PI-e.a}
    if (e.y<0){e.y=0;e.a=-e.a} if (e.y>ROWS-0.01){e.y=ROWS-0.01;e.a=-e.a}
    const ex = 6*dt*(T[i]-e.E); e.E += ex; T[i] -= ex*0.35;
    if (T[i]<0) T[i]=0;
  }
  t += dt;
}

function tempC(v){ return 25 + v*75; }
function colour(v){ // cool steel grey -> hot
  const a=[150,160,172], b=[228,87,46];
  const w=Math.min(1,Math.max(0,v))**0.7;
  return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*w)).join(',')})`;
}

function draw(){
  const W = cv.width, H = cv.height, s = state();
  ctx.clearRect(0,0,W,H);
  const fg = css('--fg'), muted = css('--muted'), line = css('--line'), hot = css('--hot'), cold = css('--cold'), el = css('--electron');
  const pad = 60, rodX = pad, rodW = W-2*pad, rodY = 70, rodH = 190;
  const sp = rodW/COLS, vsp = rodH/ROWS;

  // heater flames / ice blocks
  ctx.font = '600 14px IBM Plex Sans, sans-serif'; ctx.textAlign='center';
  const flame = (x) => { ctx.fillStyle = hot; for (let i=0;i<5;i++){ const fy = rodY+rodH*(i+0.5)/5, fl = 10+18*s.power*(0.7+0.3*Math.sin(t*20+i)); ctx.beginPath(); ctx.moveTo(x, fy-9); ctx.quadraticCurveTo(x+(x<W/2?-fl:fl), fy, x, fy+9); ctx.fill(); } ctx.fillStyle = hot; ctx.fillText('HEAT', x+(x<W/2?-26:26), rodY-12); };
  const iceBlock = (x) => { ctx.fillStyle = cold; ctx.globalAlpha=.25; ctx.fillRect(x<W/2?x-34:x+6, rodY-6, 28, rodH+12); ctx.globalAlpha=1; ctx.fillStyle = cold; ctx.fillText('ICE', x+(x<W/2?-20:20), rodY-12); };
  if (heater==='left'||heater==='both') flame(rodX-6);
  if (heater==='right'||heater==='both') flame(rodX+rodW+6);
  if (s.ice){ if (heater!=='right') iceBlock(rodX+rodW); if (heater!=='left') iceBlock(rodX); }

  // rod outline
  ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.strokeRect(rodX, rodY, rodW, rodH);

  // particles with vibration amplitude set by temperature
  const pos = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const i = idx(c,r), v = T[i];
    const amp = sp*(0.04+0.34*v);
    const ph = i*1.7;
    const x = rodX+sp*(c+0.5) + amp*Math.sin(t*(26+10*v)+ph), y = rodY+vsp*(r+0.5) + amp*0.8*Math.cos(t*(23+9*v)+ph*1.3);
    pos[i] = [x,y];
  }
  // bonds, and collision flashes when neighbours get close
  ctx.lineWidth = 1;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const i=idx(c,r);
    for (const j of [c<COLS-1?idx(c+1,r):-1, r<ROWS-1?idx(c,r+1):-1]) if (j>=0){
      const dx=pos[j][0]-pos[i][0], dy=pos[j][1]-pos[i][1], d=Math.hypot(dx,dy), rest = j===i+1?sp:vsp;
      ctx.strokeStyle = line; ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(...pos[i]); ctx.lineTo(...pos[j]); ctx.stroke(); ctx.globalAlpha = 1;
      if ($('collide').checked && d < rest*0.62){
        ctx.fillStyle = hot; ctx.globalAlpha = .55; ctx.beginPath(); ctx.arc((pos[i][0]+pos[j][0])/2,(pos[i][1]+pos[j][1])/2, 7, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
  }
  const pr = Math.min(sp,vsp)*0.3;
  for (let i=0;i<T.length;i++){ ctx.fillStyle = colour(T[i]); ctx.beginPath(); ctx.arc(pos[i][0],pos[i][1],pr,0,7); ctx.fill(); }
  // electrons
  if ($('electrons').checked) for (const e of electrons){
    ctx.fillStyle = el; ctx.beginPath(); ctx.arc(rodX+e.x*sp, rodY+e.y*vsp, 3.2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = muted; ctx.font = '12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  ctx.fillText(s.mat.electrons ? 'Grey/red dots: atoms vibrating about fixed positions.  Yellow dots: free electrons.' : 'Grey/red dots: atoms vibrating about fixed positions. No free electrons in this material.', rodX, rodY+rodH+22);

  // temperature along the rod
  const gX = rodX, gY = 320, gW = rodW, gH = 150;
  ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(gX,gY); ctx.lineTo(gX,gY+gH); ctx.lineTo(gX+gW,gY+gH); ctx.stroke();
  ctx.fillStyle = muted; ctx.textAlign='right'; ctx.font='12px IBM Plex Mono, monospace';
  for (const [v,l] of [[0,'25'],[0.5,'62.5'],[1,'100']]){ const y=gY+gH-v*gH; ctx.fillText(l, gX-8, y+4); ctx.strokeStyle=line; ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(gX,y); ctx.lineTo(gX+gW,y); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.save(); ctx.translate(18, gY+gH/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.fillText('temperature / °C', 0, 0); ctx.restore();
  ctx.textAlign='center'; ctx.fillStyle=fg; ctx.fillText('position along the rod', gX+gW/2, gY+gH+30);
  ctx.textAlign='left'; ctx.fillText('left end', gX, gY+gH+16); ctx.textAlign='right'; ctx.fillText('right end', gX+gW, gY+gH+16);
  ctx.strokeStyle = hot; ctx.lineWidth = 2.5; ctx.beginPath();
  const col = new Float32Array(COLS);
  for (let c=0;c<COLS;c++){ let a=0; for (let r=0;r<ROWS;r++) a+=T[idx(c,r)]; col[c]=a/ROWS; const x=gX+sp*(c+0.5), y=gY+gH-col[c]*gH; c?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.stroke(); ctx.lineWidth=1;
  ctx.fillStyle = muted; ctx.textAlign='left'; ctx.font='12px IBM Plex Sans, sans-serif';
  ctx.fillText(`t = ${t.toFixed(0)} s`, gX+gW-80, gY-6);

  $('tL').textContent = tempC(col[0]).toFixed(0)+' °C';
  $('tM').textContent = tempC(col[COLS>>1]).toFixed(0)+' °C';
  $('tR').textContent = tempC(col[COLS-1]).toFixed(0)+' °C';
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (running){ const n = 10; for (let i=0;i<n;i++) step(dt*state().speed/n); }
  draw(); requestAnimationFrame(frame);
}

function notice(){
  const m = MATERIALS[$('material').value];
  $('notice').innerHTML = `<b>What to notice.</b> ${m.label} Watch the heated end: the atoms vibrate with a bigger amplitude and bump their neighbours, so the vibration spreads along. The graph shows the temperature dropping away from the heater.`;
  $('electrons').disabled = !m.electrons;
}

// controls
$('heaterSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; heater = b.dataset.v; [...$('heaterSeg').children].forEach(x=>x.setAttribute('aria-pressed', x===b)); });
$('power').addEventListener('input', () => $('powerV').textContent = $('power').value+'%');
$('speed').addEventListener('input', () => $('speedV').textContent = (+$('speed').value).toFixed(1)+'×');
$('material').addEventListener('change', () => { reset(); notice(); });
$('play').addEventListener('click', () => { running = !running; $('play').textContent = running?'Pause':'Play'; });
$('reset').addEventListener('click', reset);
reset(); notice(); requestAnimationFrame(frame);
})();
</script>
