<title>Pressure Lab</title>
<meta charset="utf-8">

<header>
  <h1>Pressure Lab</h1>
  <span class="lo">2021 LSS · Ch 9 · pressure = force ÷ area: bed of nails, sharp and blunt, snowshoes</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="520" aria-label="A person on a bed of nails, or objects pressing into a surface"></canvas>
    <p class="notice" id="notice"></p>
  </div>
  <div class="panel">
    <div class="ctl">
      <span class="lbl">Mode</span>
      <div class="seg" id="modeSeg">
        <button data-v="nails" aria-pressed="true">Bed of nails</button>
        <button data-v="sharp" aria-pressed="false">Sharp or blunt?</button>
      </div>
    </div>

    <div id="nCtl" style="display:flex;flex-direction:column;gap:12px">
      <div class="ctl">
        <div class="row"><label for="nails">Number of nails under the person</label><span class="val" id="nailsV">1</span></div>
        <input type="range" id="nails" min="0" max="8" step="1" value="0">
      </div>
      <div class="ctl">
        <div class="row"><label for="weight">Weight of the person</label><span class="val" id="weightV">500 N</span></div>
        <input type="range" id="weight" min="300" max="900" step="50" value="500">
      </div>
      <div class="ctl">
        <label class="check"><input type="checkbox" id="arrows" checked> Show the force on each nail</label>
        <label class="check"><input type="checkbox" id="working" checked> Show the working</label>
      </div>
      <div class="ctl">
        <label for="face">Put your own face on the person (stays on this device)</label>
        <input type="file" id="face" accept="image/*" capture="user" style="font-size:.8rem">
        <button class="btn" id="noFace">Remove photo</button>
      </div>
      <div class="read">
        <div><small>Force on each nail</small><span id="rF">–</span></div>
        <div><small>Pressure on the skin</small><span id="rP">–</span></div>
      </div>
      <div class="fb" id="nFb"></div>
    </div>

    <div id="sCtl" class="hide" style="flex-direction:column;gap:12px">
      <div class="ctl">
        <label for="obj">Compare</label>
        <select id="obj">
          <option value="pin">drawing pin: point vs head</option>
          <option value="knife">knife: sharp edge vs blunt edge</option>
          <option value="shoe">stiletto heel vs flat shoe</option>
          <option value="snow">boots vs snowshoes on snow</option>
          <option value="elephant">elephant's foot vs person's heel</option>
        </select>
      </div>
      <div class="ctl">
        <div class="row"><label for="force">Force pushing down</label><span class="val" id="forceV">20 N</span></div>
        <input type="range" id="force" min="5" max="6000" step="5" value="20">
      </div>
      <div class="read">
        <div><small id="aL">Small area</small><span id="aP">–</span></div>
        <div><small id="bL">Large area</small><span id="bP">–</span></div>
      </div>
      <div class="fb" id="sFb"></div>
    </div>
  </div>
</div>

<script>
(() => {
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode='nails', t=0, last=performance.now(), faceImg=null;
const NAILS=[1,4,16,36,64,100,196,324,400], TIP=1e-6; // m² per nail point (about 1 mm²)
const PIERCE=1.5e6;                                   // Pa: a nail point pierces skin above about this
function wrap(text,x,y,w,lh){ const words=text.split(' '); let line='', yy=y; for (const wd of words){ const test=line+wd+' '; if (ctx.measureText(test).width>w && line){ ctx.fillText(line,x,yy); line=wd+' '; yy+=lh; } else line=test; } ctx.fillText(line,x,yy); return yy; }
const fmtP=P=> P>=1e6? (+(P/1e6).toPrecision(3))+' MPa' : P>=1000? (+(P/1000).toPrecision(3))+' kPa' : (+P.toPrecision(3))+' Pa';
const fmtA=A=> A>=0.01? (+(A*1e4).toPrecision(3))+' cm²' : (+(A*1e6).toPrecision(3))+' mm²';

function drawNails(dt){
  t+=dt;
  const fg=css('--fg'), muted=css('--muted'), line=css('--line'), hot=css('--hot'), good=css('--good'), acc=css('--accent');
  const n=NAILS[+$('nails').value], W=+$('weight').value, F=W/n, P=F/TIP, pierced=P>PIERCE;
  ctx.clearRect(0,0,cv.width,cv.height);
  // bed
  const bx=120, bw=560, by=372;
  ctx.fillStyle='#8a6a3a'; ctx.fillRect(bx-20,by,bw+40,26); ctx.fillRect(bx-10,by+26,16,60); ctx.fillRect(bx+bw-6,by+26,16,60);
  // nails: draw up to 40 across, spaced evenly; height 34
  const shown=Math.min(n,40), cols=shown, sp=bw/(cols+1);
  ctx.fillStyle='#6b7280'; for (let i=0;i<shown;i++){ const x=bx+sp*(i+1); ctx.beginPath(); ctx.moveTo(x-3,by); ctx.lineTo(x+3,by); ctx.lineTo(x,by-34); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle=muted; ctx.font='11px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(n===1?'1 nail':`${n} nails (${shown} drawn across the bed${n>40?', more behind':''})`, bx+bw/2, by+50);
  // person: lies on the points if safe, sinks a little onto them if pierced
  const sink=pierced?8:0, py=by-34-26+sink;
  ctx.strokeStyle=fg; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(200,py); ctx.lineTo(560,py); ctx.stroke();                     // body
  ctx.beginPath(); ctx.moveTo(560,py); ctx.lineTo(620,py-30); ctx.moveTo(560,py); ctx.lineTo(630,py+2); ctx.stroke(); // legs
  ctx.beginPath(); ctx.moveTo(300,py); ctx.lineTo(330,py-30); ctx.moveTo(300,py); ctx.lineTo(270,py-28); ctx.stroke(); // arms
  ctx.lineWidth=1; ctx.lineCap='butt';
  // head with the face
  const hx=172, hy=py-6, hr=30;
  ctx.save(); ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.closePath(); ctx.clip();
  if (faceImg){ const s=Math.max(2*hr/faceImg.width, 2*hr/faceImg.height); ctx.drawImage(faceImg, hx-faceImg.width*s/2, hy-faceImg.height*s/2, faceImg.width*s, faceImg.height*s); }
  else { ctx.fillStyle='#f3d2b3'; ctx.fillRect(hx-hr,hy-hr,2*hr,2*hr); ctx.font='44px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(pierced?'😖':n>=100?'😌':'😬', hx, hy+2); ctx.textBaseline='alphabetic'; }
  ctx.restore(); ctx.strokeStyle=fg; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.stroke(); ctx.lineWidth=1;
  // weight arrow and per-nail force arrows
  ctx.strokeStyle=acc; ctx.fillStyle=acc; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(380,py-70); ctx.lineTo(380,py-12); ctx.stroke(); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(380,py-6); ctx.lineTo(374,py-16); ctx.lineTo(386,py-16); ctx.fill();
  ctx.font='600 12px IBM Plex Sans, sans-serif'; ctx.textAlign='left'; ctx.fillText(`weight ${W} N, shared between the nails`, 392, py-50);
  if ($('arrows').checked){ const L=Math.max(6, Math.min(60, 60*F/500)); ctx.strokeStyle=hot; ctx.fillStyle=hot; for (let i=0;i<shown;i++){ const x=bx+sp*(i+1); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,by-34); ctx.lineTo(x,by-34-L); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x,by-34-L-5); ctx.lineTo(x-3,by-34-L+2); ctx.lineTo(x+3,by-34-L+2); ctx.fill(); } ctx.lineWidth=1; }
  if (pierced){ ctx.fillStyle=hot; ctx.font='700 18px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('OUCH! the point pierces the skin', 450, 90); for (let i=0;i<6;i++){ ctx.fillStyle=hot; ctx.beginPath(); ctx.arc(300+i*40+Math.sin(t*5+i)*4, py+18, 3,0,7); ctx.fill(); } }
  else { ctx.fillStyle=good; ctx.font='700 18px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('Comfortable: the skin is not pierced', 450, 90); }
  if ($('working').checked){ ctx.textAlign='left'; ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif';
    [`force on each nail = ${W} N ÷ ${n} = ${+F.toPrecision(3)} N`, `area of one nail point ≈ 1 mm² = 0.000001 m²`, `pressure on the skin = ${+F.toPrecision(3)} N ÷ 0.000001 m² = ${fmtP(P)}`, `skin is pierced above about ${fmtP(PIERCE)}`].forEach((s,i)=>ctx.fillText(s, 30, 130+i*22)); }
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  wrap('The total area of all the points = number of nails × 1 mm². Same weight, bigger total area, smaller pressure. That is the whole trick.', 30, 470, 840, 16);
  $('nailsV').textContent=n; $('weightV').textContent=W+' N'; $('rF').textContent=(+F.toPrecision(3))+' N'; $('rP').textContent=fmtP(P);
  $('nFb').className='fb '+(pierced?'bad':'ok'); $('nFb').textContent = pierced ? `${n} nail${n>1?'s':''}: each point pushes with ${+F.toPrecision(3)} N on a tiny area, so the pressure is huge.` : `${n} nails share the weight: only ${+F.toPrecision(3)} N on each point, so the pressure is below what pierces skin.`;
}

const OBJ={
  pin:{a:['the point',5e-7],b:['the head',1e-4],icon:'📌',surf:'wood',max:60,note:'The same push from your thumb: the point goes into the wood, the head spreads the force over your thumb.'},
  knife:{a:['sharp edge (0.1 mm × 10 cm)',1e-5],b:['blunt edge (2 mm × 10 cm)',2e-4],icon:'🔪',surf:'a tomato',max:60,note:'A sharp knife has a much smaller area at its edge, so the same force gives a far larger pressure and it cuts.'},
  shoe:{a:['stiletto heel (1 cm²)',1e-4],b:['flat shoe (150 cm²)',1.5e-2],icon:'👠',surf:'a wooden floor',max:800,note:'A 600 N person on a stiletto heel puts more pressure on the floor than an elephant: that is why heels dent wooden floors.'},
  snow:{a:['boots (400 cm²)',4e-2],b:['snowshoes (2500 cm²)',0.25],icon:'🥾',surf:'soft snow',max:1000,note:'Snowshoes spread the weight over a large area, so the pressure is small and you do not sink. Camels have wide feet for the same reason on sand.'},
  elephant:{a:["person's heel (20 cm²)",2e-3],b:["elephant's foot (1000 cm², one of four)",0.1],icon:'🐘',surf:'mud',max:6000,note:'Elephants are heavy, but their feet are so wide that the pressure on the ground is less than a person on their heel.'},
};
function drawSharp(dt){
  t+=dt;
  const fg=css('--fg'), muted=css('--muted'), line=css('--line'), hot=css('--hot'), good=css('--good'), acc=css('--accent');
  const o=OBJ[$('obj').value], F=+$('force').value, Pa=F/o.a[1], Pb=F/o.b[1];
  ctx.clearRect(0,0,cv.width,cv.height);
  const panel=(x,lab,A,P,i)=>{ const w=380; ctx.fillStyle=css('--panel'); ctx.strokeStyle=line; ctx.fillRect(x,60,w,330); ctx.strokeRect(x,60,w,330);
    ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText(lab, x+w/2, 84);
    // surface and dent: dent depth scales with log of pressure
    const dent=Math.max(0, Math.min(90, 18*Math.log10(P/2e3)));
    ctx.fillStyle='#d9c9a8'; ctx.fillRect(x+30,260,w-60,110);
    ctx.fillStyle=css('--panel'); const cw=Math.max(14, Math.min(200, Math.sqrt(A)*900)); ctx.beginPath(); ctx.moveTo(x+w/2-cw/2-16,260); ctx.quadraticCurveTo(x+w/2-cw/2,260,x+w/2-cw/2,260+dent); ctx.lineTo(x+w/2+cw/2,260+dent); ctx.quadraticCurveTo(x+w/2+cw/2,260,x+w/2+cw/2+16,260); ctx.closePath(); ctx.fill();
    ctx.fillStyle=fg; ctx.fillRect(x+w/2-cw/2, 200+dent, cw, 60); ctx.font='34px system-ui, sans-serif'; ctx.fillText(o.icon, x+w/2, 190+dent);
    ctx.strokeStyle=acc; ctx.fillStyle=acc; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+w/2,110); ctx.lineTo(x+w/2,150+dent); ctx.stroke(); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+w/2,156+dent); ctx.lineTo(x+w/2-6,146+dent); ctx.lineTo(x+w/2+6,146+dent); ctx.fill();
    ctx.font='12px IBM Plex Sans, sans-serif'; ctx.fillStyle=fg; ctx.textAlign='center'; ctx.fillText(`force ${F} N`, x+w/2+50, 130);
    ctx.font='11px IBM Plex Mono, monospace'; ctx.fillStyle=muted; ctx.fillText(`area ${fmtA(A)}`, x+w/2, 102);
    ctx.font='600 13px IBM Plex Mono, monospace'; ctx.fillStyle=P>Pb*1.5||P>Pa*1.5?hot:fg; ctx.fillStyle=i===0?hot:good; ctx.fillText(`p = ${F} ÷ ${A} = ${fmtP(P)}`, x+w/2, 384); };
  panel(40,o.a[0],o.a[1],Pa,0); panel(480,o.b[0],o.b[1],Pb,1);
  ctx.fillStyle=muted; ctx.font='12px IBM Plex Sans, sans-serif'; ctx.textAlign='center'; ctx.fillText('pressing into '+o.surf, 450, 50);
  ctx.fillStyle=fg; ctx.font='13px IBM Plex Sans, sans-serif'; ctx.textAlign='left';
  wrap(`Same force, ${Math.round(o.b[1]/o.a[1])}× the area: the pressure is ${Math.round(o.b[1]/o.a[1])}× smaller. ${o.note}`, 40, 420, 820, 18);
  $('forceV').textContent=F+' N'; $('aL').textContent=o.a[0].split(' (')[0]; $('bL').textContent=o.b[0].split(' (')[0]; $('aP').textContent=fmtP(Pa); $('bP').textContent=fmtP(Pb);
  $('sFb').textContent=`Pressure = force ÷ area. ${fmtP(Pa)} is ${Math.round(Pa/Pb)} times ${fmtP(Pb)}.`;
}
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (mode==='nails') drawNails(dt); else drawSharp(dt); requestAnimationFrame(frame); }
function notice(){ $('notice').innerHTML = mode==='nails'
  ? '<b>What to notice.</b> Pressure = force ÷ area. One nail takes the whole weight on a tiny point: enormous pressure, so it pierces. Hundreds of nails share the weight, so the force on each point is small and the pressure drops below what the skin can take. The weight never changed.'
  : '<b>What to notice.</b> Keep the force the same and shrink the area: the pressure shoots up. Sharp things cut and pierce because of their small area; wide things (snowshoes, elephant feet, flat shoes) spread the force so the pressure is small.'; }
const seg=(id,fn)=>$(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b)); fn(b.dataset.v); });
seg('modeSeg',v=>{ mode=v; $('nCtl').classList.toggle('hide',mode!=='nails'); $('sCtl').classList.toggle('hide',mode!=='sharp'); $('sCtl').style.display=mode==='sharp'?'flex':''; notice(); });
$('face').addEventListener('change',()=>{ const f=$('face').files[0]; if (!f) return; const img=new Image(); img.onload=()=>{ faceImg=img; }; img.src=URL.createObjectURL(f); });
$('noFace').addEventListener('click',()=>{ faceImg=null; $('face').value=''; });
$('obj').addEventListener('change',()=>{ const o=OBJ[$('obj').value]; $('force').max=o.max; $('force').value=Math.min(+$('force').value,o.max); });
notice(); requestAnimationFrame(frame);
})();
</script>
