<title>Convection Tank</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: lab bench. Wide canvas stage on the left, instrument panel on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1d2430; --muted:#5b6675; --line:#cfd6de;
  --accent:#1f6feb; --hot:#e4572e; --cold:#2a7de1; --ok:#2e9e5b; --trace:#7b3fe4;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--cold:#5aa6ff;--ok:#4cc078;--trace:#b08cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141920;--panel:#1d242e;--fg:#e8edf3;--muted:#98a4b3;--line:#303a47;--accent:#5a9cff;--hot:#ff7a50;--cold:#5aa6ff;--ok:#4cc078;--trace:#b08cff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance}
.lo{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{display:block;width:100%;height:auto}
.notice{font-size:.9rem;color:var(--muted);margin:8px 2px 0}
.notice b{color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;align-self:start}
.ctl{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.val{font-family:var(--mono);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.seg button{font:inherit;font-size:.85rem;padding:6px 4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.buttons{display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dens{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.dens div{background:var(--bg);border-radius:8px;padding:8px 4px}
.dens span{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.dens small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
</style>

<header>
  <h1>Convection Tank</h1>
  <span class="lo">5086 · 8a, 8c · convection in terms of density changes</span>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="c" width="900" height="560" aria-label="Tank of fluid particles heated from below"></canvas>
    <p class="notice" id="notice"></p>
  </div>

  <div class="panel">
    <div class="ctl">
      <span class="lbl">Heater position (outside the tank)</span>
      <div class="seg" id="heaterSeg">
        <button data-v="bl" aria-pressed="true">Under left</button>
        <button data-v="bc" aria-pressed="false">Under centre</button>
        <button data-v="br" aria-pressed="false">Under right</button>
        <button data-v="top" aria-pressed="false">Above the top</button>
      </div>
    </div>
    <div class="ctl">
      <div class="row"><label for="power">Heater power</label><span class="val" id="powerV">70%</span></div>
      <input type="range" id="power" min="0" max="100" value="70">
    </div>
    <div class="ctl">
      <label for="fluid">Fluid</label>
      <select id="fluid">
        <option value="liquid">Liquid (water)</option>
        <option value="gas">Gas (air)</option>
      </select>
    </div>
    <div class="ctl">
      <label class="check"><input type="checkbox" id="showT" checked> Colour particles by temperature</label>
      <label class="check"><input type="checkbox" id="showD"> Show density map</label>
      <label class="check"><input type="checkbox" id="trace" checked> Trace one particle</label>
      <label class="check"><input type="checkbox" id="arrows" checked> Show flow arrows</label>
    </div>
    <div class="ctl">
      <div class="row"><label for="speed">Simulation speed</label><span class="val" id="speedV">1.0×</span></div>
      <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
    </div>
    <div class="dens">
      <div><small>Box A (above heater)</small><span id="dA">–</span></div>
      <div><small>Box B (far side)</small><span id="dB">–</span></div>
    </div>
    <div class="buttons">
      <button class="btn primary" id="play">❚❚ Pause</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Model box: 1.0 wide x 0.75 high. Each particle has a temperature T (0 = room, 1 = hottest).
// Particles never change size. A hot particle moves faster, so it keeps its neighbours further away:
// the hot region spreads out and becomes LESS DENSE. The upward push on each particle comes from the
// density of its neighbourhood, so a whole patch of spread-out fluid rises together.
const BW = 1.0, BH = 0.75, RN = 0.14;
const FLUIDS = {
  liquid:{n:210, r:0.017, jiggle:0.6, label:'In a liquid the particles stay close together. Heated particles move faster and push their neighbours slightly further apart, so the warm region becomes less dense.'},
  gas:   {n:150, r:0.011, jiggle:1.4, label:'In a gas the particles are far apart and move fast. Heated particles move even faster and spread out more, so the warm gas becomes less dense.'}
};
let P = [], t = 0, running = true, heater = 'bl', trail = [], A = 0;
const S = () => ({power:+$('power').value/100, fl:FLUIDS[$('fluid').value], speed:+$('speed').value});

function reset(){
  const f = S().fl; P = []; trail = []; t = 0; A = 0;
  const cols = Math.round(Math.sqrt(f.n*BW/BH)), rows = Math.ceil(f.n/cols);
  for (let i=0;i<f.n;i++){ const c=i%cols, r=(i/cols)|0; P.push({x:(c+0.5+Math.random()*0.3)*BW/cols, y:(r+0.5+Math.random()*0.3)*BH/rows, vx:0, vy:0, T:0, rho:1, n:0}); }
}
function heaterSpan(){ if (heater==='top') return [0.3,0.7]; const x0 = heater==='bl'?0.05:heater==='bc'?0.35:0.65; return [x0, x0+0.3]; }

// The circulation: warm fluid rises above the heater (the plume) and sinks at the walls.
// Its strength A grows only when the fluid above the heater is warmer, and so less dense, than the rest.
function flowAt(x,y){
  if (heater==='top' || A<=0) return [0,0];
  const xc=plumeX(), sy=Math.sin(Math.PI*y/BH), cy=Math.cos(Math.PI*y/BH)*Math.PI/BH;
  if (x>=xc){ const w=BW-xc, k=Math.PI/w, ph=k*(x-xc), a=A*w/Math.PI; return [a*Math.sin(ph)*cy, -a*k*Math.cos(ph)*sy]; }
  const w=xc, k=Math.PI/w, ph=k*x, a=A*w/Math.PI; return [-a*Math.sin(ph)*cy, a*k*Math.cos(ph)*sy];
}
function plumeX(){ const [h0,h1]=heaterSpan(); return (h0+h1)/2; }
function step(dt){
  const s = S(), f = s.fl, [hx0,hx1] = heaterSpan();
  // heating through the floor (or the lid), cooling at the opposite surface, slow loss everywhere
  for (const p of P){
    const inSpan = p.x>hx0 && p.x<hx1;
    if (heater!=='top'){ if (inSpan && p.y>BH-0.08) p.T += s.power*2.0*dt*(1-p.T); if (p.y<0.08) p.T -= 1.4*dt*p.T; }
    else { if (inSpan && p.y<0.08) p.T += s.power*2.0*dt*(1-p.T); }
    p.T -= 0.05*dt*p.T;
  }
  // circulation strength follows how much warmer (less dense) the plume is than the average
  if (heater!=='top'){ const xc=plumeX(); let tp=0,np=0,ta=0; for (const p of P){ ta+=p.T; if (Math.abs(p.x-xc)<0.12){ tp+=p.T; np++; } } ta/=P.length; const contrast=Math.max(0,(np?tp/np:0)-ta);
    const target=Math.min(0.32, 1.6*contrast); A += (target-A)*Math.min(1,dt/2.5); } else A *= 1-Math.min(1,dt);
  // neighbour grid for spacing: warm particles move faster and keep their neighbours further away
  const cell = RN, cols = Math.ceil(BW/cell), rows = Math.ceil(BH/cell), grid = new Map(), key=(cx,cy)=>cy*cols+cx;
  P.forEach((p,i)=>{ const k = key(Math.min(cols-1,(p.x/cell)|0), Math.min(rows-1,(p.y/cell)|0)); (grid.get(k)||grid.set(k,[]).get(k)).push(i); });
  const base = 0.92*Math.sqrt(BW*BH/f.n);
  for (let i=0;i<P.length;i++){
    const p = P[i], cx = Math.min(cols-1,(p.x/cell)|0), cy = Math.min(rows-1,(p.y/cell)|0);
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const b = grid.get(key(cx+dx,cy+dy)); if(!b) continue;
      for (const j of b){ if (j<=i) continue; const q = P[j];
        let ddx = q.x-p.x, ddy = q.y-p.y; const d = Math.hypot(ddx,ddy); if (d<1e-6) continue;
        const d0 = base*(1+0.95*(p.T+q.T)/2);
        if (d<d0){ const push=(d0-d)/d0*6*dt; ddx/=d; ddy/=d; p.vx-=ddx*push; p.vy-=ddy*push; q.vx+=ddx*push; q.vy+=ddy*push; }
        if (d<d0*1.15){ const ex=0.4*dt*(q.T-p.T); p.T+=ex; q.T-=ex; }
      }
    }
  }
  for (const p of P){
    const j = f.jiggle*(0.3+p.T)*dt;
    p.vx += (Math.random()-0.5)*j; p.vy += (Math.random()-0.5)*j;
    p.vx *= 1-6*dt; p.vy *= 1-6*dt;
    const [u,v] = flowAt(p.x,p.y);
    p.x += (u+p.vx)*dt; p.y += (v+p.vy)*dt; const r=f.r;
    if (p.x<r){p.x=r;p.vx=Math.abs(p.vx)} if (p.x>BW-r){p.x=BW-r;p.vx=-Math.abs(p.vx)}
    if (p.y<r){p.y=r;p.vy=Math.abs(p.vy)} if (p.y>BH-r){p.y=BH-r;p.vy=-Math.abs(p.vy)}
  }
  if ($('trace').checked){ trail.push([P[0].x,P[0].y]); if (trail.length>600) trail.shift(); } else trail.length = 0;
  t += dt;
}

function colour(v, on){
  if (!on) return css('--muted');
  const a=[42,125,225], b=[228,87,46], w=Math.min(1,Math.max(0,v))**0.6;
  return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*w)).join(',')})`;
}

function draw(){
  const W=cv.width, H=cv.height, s=S();
  ctx.clearRect(0,0,W,H);
  const fg=css('--fg'), muted=css('--muted'), line=css('--line'), hot=css('--hot'), trace=css('--trace'), accent=css('--accent');
  const pad=40, tankX=pad, tankY=60, tankW=W-2*pad-200, tankH=tankW*BH/BW;
  const X = x=>tankX+x/BW*tankW, Y = y=>tankY+y/BH*tankH;
  if ($('showD').checked){
    const gc=16, gr=12, cnt=new Float32Array(gc*gr);
    for (const p of P){ const cx=Math.min(gc-1,(p.x/BW*gc)|0), cy=Math.min(gr-1,(p.y/BH*gr)|0); cnt[cy*gc+cx]++; }
    const avg = P.length/(gc*gr);
    for (let cy=0;cy<gr;cy++) for (let cx=0;cx<gc;cx++){ const v = cnt[cy*gc+cx]/avg; ctx.fillStyle = accent; ctx.globalAlpha = Math.min(0.85, Math.max(0, (v-0.35)*0.42)); ctx.fillRect(X(cx*BW/gc), Y(cy*BH/gr), tankW/gc+0.5, tankH/gr+0.5); }
    ctx.globalAlpha = 1;
  }
  // tank walls
  ctx.strokeStyle=fg; ctx.lineWidth=4; ctx.strokeRect(tankX,tankY,tankW,tankH); ctx.lineWidth=1;
  // heater OUTSIDE the tank: a hot plate with flames under the floor, or a plate above the top
  const [hx0,hx1] = heaterSpan(), x0=X(hx0), x1=X(hx1);
  ctx.fillStyle = hot; ctx.globalAlpha = 0.35+0.6*s.power;
  if (heater==='top'){ ctx.fillRect(x0, tankY-20, x1-x0, 12); }
  else { ctx.fillRect(x0, tankY+tankH+6, x1-x0, 10); for (let i=0;i<6;i++){ const fx=x0+(i+0.5)*(x1-x0)/6, fl=8+16*s.power*(0.7+0.3*Math.sin(t*18+i)); ctx.beginPath(); ctx.moveTo(fx-6,tankY+tankH+30); ctx.quadraticCurveTo(fx,tankY+tankH+30-fl-6,fx+6,tankY+tankH+30); ctx.fill(); } }
  ctx.globalAlpha=1; ctx.fillStyle = hot; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.textAlign='center';
  ctx.fillText('HEATER', (x0+x1)/2, heater==='top'? tankY-26 : tankY+tankH+48);
  // flow arrows
  if ($('arrows').checked && A>0.01){ const gc=8, gr=5; ctx.strokeStyle=fg; ctx.fillStyle=fg; ctx.globalAlpha=Math.min(.6,A*4); ctx.lineWidth=2;
    for (let gy=0;gy<gr;gy++) for (let gx=0;gx<gc;gx++){ const mx=(gx+0.5)*BW/gc, my=(gy+0.5)*BH/gr; const [vx,vy]=flowAt(mx,my); const m=Math.hypot(vx,vy); if (m<0.01) continue; const cx=X(mx), cy=Y(my), L=Math.min(36, 14+m*120), ux=vx/m, uy=vy/m;
      ctx.beginPath(); ctx.moveTo(cx-ux*L/2, cy-uy*L/2); ctx.lineTo(cx+ux*L/2, cy+uy*L/2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx+ux*(L/2+6), cy+uy*(L/2+6)); ctx.lineTo(cx+ux*L/2-uy*5, cy+uy*L/2+ux*5); ctx.lineTo(cx+ux*L/2+uy*5, cy+uy*L/2-ux*5); ctx.fill(); }
    ctx.globalAlpha=1; ctx.lineWidth=1; }
  if (trail.length>1){ ctx.strokeStyle=trace; ctx.lineWidth=2; ctx.beginPath(); trail.forEach(([x,y],i)=>i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))); ctx.stroke(); ctx.lineWidth=1; }
  const showT = $('showT').checked, pr = s.fl.r/BW*tankW;
  P.forEach(p=>{ ctx.fillStyle = colour(p.T, showT); ctx.beginPath(); ctx.arc(X(p.x),Y(p.y), pr, 0, 7); ctx.fill(); });
  if ($('trace').checked){ ctx.strokeStyle=trace; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(X(P[0].x),Y(P[0].y),pr*1.9,0,7); ctx.stroke(); ctx.lineWidth=1; }
  // sample boxes A (above the heater) and B (far side), equal size: count the particles
  const bw=0.16, bh=0.16, aX = (hx0+hx1)/2-bw/2, aY = heater==='top'?0.06:0.40;
  const bX = heater==='bl'?0.76:0.08, bY = heater==='top'?0.06:0.40;
  const count = (x0,y0)=>P.filter(p=>p.x>x0&&p.x<x0+bw&&p.y>y0&&p.y<y0+bh).length;
  for (const [bx0,by0,lab,id] of [[aX,aY,'A',$('dA')],[bX,bY,'B',$('dB')]]){
    ctx.setLineDash([5,4]); ctx.strokeStyle=fg; ctx.strokeRect(X(bx0),Y(by0),bw/BW*tankW,bh/BH*tankH); ctx.setLineDash([]);
    ctx.fillStyle=fg; ctx.font='600 12px IBM Plex Mono, monospace'; ctx.textAlign='left'; ctx.fillText(lab, X(bx0)+4, Y(by0)+14);
    id.textContent = count(bx0,by0)+' particles';
  }
  const lx = tankX+tankW+24, ly = tankY;
  ctx.textAlign='left'; ctx.fillStyle=fg; ctx.font='600 13px IBM Plex Sans, sans-serif'; ctx.fillText('Key', lx, ly+4);
  ctx.font='12px IBM Plex Sans, sans-serif';
  const rows=[[colour(0,true),'cool particle'],[colour(1,true),'warm particle'],[trace,'traced particle'],[fg,'A, B: equal boxes']];
  rows.forEach(([c,txt],i)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(lx+6, ly+30+i*22, 5, 0, 7); ctx.fill(); ctx.fillStyle=muted; ctx.fillText(txt, lx+18, ly+34+i*22); });
  ctx.fillStyle=muted; const notes=['Particles never get bigger.','Warm ones move faster and','spread apart: fewer particles','in the same space = less dense.','The less dense patch rises','as a group; cooler, denser','fluid sinks to replace it.'];
  notes.forEach((n,i)=>ctx.fillText(n, lx, ly+140+i*18));
  if ($('showD').checked){ ctx.fillStyle=accent; ctx.globalAlpha=.5; ctx.fillRect(lx, ly+290, 12, 12); ctx.globalAlpha=1; ctx.fillStyle=muted; ctx.fillText('deeper blue = denser', lx+18, ly+300); }
  ctx.fillStyle=muted; ctx.fillText(`t = ${t.toFixed(0)} s`, lx, tankY+tankH);
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if (running){ for (let i=0;i<3;i++) step(dt*S().speed/3); }
  draw(); requestAnimationFrame(frame);
}
function notice(){
  const topMsg = heater==='top' ? ' <b>Heater above the top:</b> the warm, less dense fluid is already at the top, so it has nowhere to rise to and no current forms. The bottom stays cold.' : '';
  $('notice').innerHTML = `<b>What to notice.</b> ${S().fl.label} That less dense patch floats upwards as a group, and cooler, denser fluid sinks to take its place: a convection current. Compare boxes A and B: the same space holds fewer particles where the fluid is warm.${topMsg}`;
}
$('heaterSeg').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; heater=b.dataset.v; [...$('heaterSeg').children].forEach(x=>x.setAttribute('aria-pressed',x===b)); A=0; notice(); });
$('power').addEventListener('input', ()=>$('powerV').textContent=$('power').value+'%');
$('speed').addEventListener('input', ()=>$('speedV').textContent=(+$('speed').value).toFixed(1)+'×');
$('fluid').addEventListener('change', ()=>{ reset(); notice(); });
$('play').addEventListener('click', ()=>{ running=!running; $('play').textContent=running?'❚❚ Pause':'▶ Play'; });
$('reset').addEventListener('click', reset);
reset(); notice(); requestAnimationFrame(frame);
})();
</script>
